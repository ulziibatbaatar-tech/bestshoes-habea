<body>
<div id="app"></div>
<script>
// ═══════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzMTG3K4pEERr2qz_SsbxWQi5IG6u2j0nUd_NpcdAuPcc3IvDPeeenlVknChOosM8t/exec";
const SHEET_URL  = "https://docs.google.com/spreadsheets/d/1OB8ejIU4RxtuyelQpQVT5PSL6aWWt2gJbx9lo8dhTaU/edit";
const APP_URL    = "https://best-shoes2026.netlify.app";
const ALERT_HOUR = 9, ALERT_MIN = 15;

// ═══ ӨДӨРТ 1 УДАА ЛИМИТ ШАЛГАХ ═══
function hasSignedToday(name){
  const recs=getRecs();
  return recs.some(r=>r.name===name&&r.date===toDay());
}

// ═══ GOOGLE SHEETS-ААС БҮРТГЭЛ ТАТАХ (БОДИТ ЦАГИЙН СИНК) ═══
async function fetchTodayRecs(){
  try{
    const res=await fetch(SCRIPT_URL+"?action=getToday&date="+encodeURIComponent(toDay()),{method:"GET",mode:"cors"});
    if(!res.ok)return null;
    const data=await res.json();
    if(data&&data.records){
      // Sheets-ийн мэдээллийг localStorage-тай нэгтгэнэ
      const local=getRecs();
      const sheetsNames=new Set(data.records.map(r=>r.name+"_"+r.date));
      const merged=[...local];
      data.records.forEach(r=>{
        if(!merged.some(m=>m.name===r.name&&m.date===r.date)){
          merged.push({...r,fromSheets:true});
        }
      });
      saveRecs(merged);
      return merged;
    }
  }catch(e){}
  return null;
}

const INSTRUCTIONS = [

  "Машин тоног төхөөрөмжийн бүрэн бүтэн байдлыг шалгаж өөрийн хариуцсан ажлын аюулгүй ажиллагааны заавартай танилцсаны дараа ажлаа эхлүүлнэ.",

  "Ажлын ширээ, сандал, хувцасны шүүгээний бүрэн бүтэн байдал, цахилгаан хэрэгслүүдийн хэвийн ажиллагаа, галын аюулгүй байдал зэргийг шалгана.",
  "Ажил үүргээ гүйцэтгэж байхдаа халтирч унах, хаалганд гар хөлөө хавчуулах, толгойгоо цохих, хурц ирмэгтэй зүйлд гараа зүсэх хатгахаас сэргийлж ажиллах.",
  "Цахилгааны залгуурт хэт их ачаалал өгөхгүй байж хэрэглээгүй цахилгаан хэрэгслийг байнга салгаж хэвших.",
  "Онцгой байдал үүссэн нөхцөлд өөрийн болон бусдын амь нас, эрүүл мэнд, эд хөрөнгийг хамгаалах арга хэмжээнд идэвхтэй оролцоно.",
  "Ажлын байран дахь санамж дохио тэмдэгтүүдийг анхаарч ажиллаж хэвших.",
  "Ажлын байранд ил гал гаргахыг хориглоно."
];
const CHECKLIST = [
  {cat:"🏭 Ажлын байрны 5S", items:["Сайн ангилан ялгах","Сайн зохион байгуулах","Сайн цэвэрлэх","Сайн хэвшүүлэх","Сайн хэрэгжүүлэх"]},
  {cat:"🏭 Аюулгүй байдал",  items:["Өдөр тутмын зааварчилгаа авсан","Мэдрэл сэтгэхүйн ачаалалгүй","Согтууруулах ундаа хэрэглээгүй","Галын аюулгүй байдлыг хангасан"]},
  {cat:"⚙️ Тоног төхөөрөмж", items:["Тоног төхөөрөмж шалгасан","Цахилгаан утас гэмтэлгүй","Орчны аюулгүй байдлыг шалгасан","Цаг ашиглалт хөтлөсөн"]}
];
const ALL_ITEMS = CHECKLIST.flatMap(c=>c.items);

const K = {recs:"habea_recs_v5",wrks:"habea_wrks_v3",pin:"habea_pin_v1",queue:"habea_queue_v1",notif:"habea_notif_v1"};

// ═══ STORAGE ═══
const get  = k => { try{return JSON.parse(localStorage.getItem(k)||"null");}catch{return null;} };
const set  = (k,v) => localStorage.setItem(k,JSON.stringify(v));
const getRecs  = () => get(K.recs)  || [];
const saveRecs = v  => set(K.recs,v);
const getWrks  = () => get(K.wrks)  || [];
const saveWrks = v  => set(K.wrks,v);
const getQueue = () => get(K.queue) || [];
const saveQueue= v  => set(K.queue,v);
const getPin   = ()  => localStorage.getItem(K.pin)||"9761";
const savePin  = v   => localStorage.setItem(K.pin,v);

function toDay(){ return new Date().toLocaleDateString("mn-MN",{year:"numeric",month:"2-digit",day:"2-digit"}); }
function toNow(){ return new Date().toLocaleTimeString("mn-MN",{hour:"2-digit",minute:"2-digit"}); }
function initials(n){ if(!n)return"?"; return n.trim().split(/\s+/).slice(0,2).map(p=>p[0]||"").join("").toUpperCase()||"?"; }
function chk(){ return '<svg width="11" height="9" viewBox="0 0 11 9" fill="none"><polyline points="1,4.5 4,7.5 10,1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }

// ═══ DOM ═══
function el(tag,props,kids){
  const e=document.createElement(tag);
  for(const k in props||{}){
    if(k==="className")e.className=props[k];
    else if(k==="style"&&typeof props[k]==="object")Object.assign(e.style,props[k]);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),props[k]);
    else if(k==="disabled"&&props[k])e.disabled=true;
    else e.setAttribute(k,props[k]);
  }
  (kids||[]).flat().forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});
  return e;
}
function h(tag,p,...c){return el(tag,p,c);}
let _tt;
function toast(msg,type){
  document.querySelectorAll(".toast").forEach(t=>t.remove());clearTimeout(_tt);
  const t=el("div",{className:"toast",style:{background:type==="err"?"#c0392b":type==="info"?"#2474a8":"#1a6a3a"}},[msg]);
  document.body.appendChild(t);_tt=setTimeout(()=>t.remove(),3500);
}
function brand(fs,white){
  const d=el("div",{className:"brand"});
  d.innerHTML=`<span class="b-best" style="font-size:${fs}px">BEST</span><span class="${white?"b-shoes-w":"b-shoes-d"}" style="font-size:${fs}px">SHOES</span>`;
  return d;
}

// ═══ NOTIFICATION ═══
async function reqNotif(){
  if(!("Notification" in window))return false;
  if(Notification.permission==="granted")return true;
  if(Notification.permission==="denied")return false;
  return(await Notification.requestPermission())==="granted";
}
function sendNotif(title,body){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  new Notification(title,{body,icon:"icon-192x192.png"});
}
function startAlertTimer(){
  const todayKey="notif_"+toDay();
  if(localStorage.getItem(K.notif)===todayKey)return;
  const check=()=>{
    const n=new Date();
    if(n.getHours()===ALERT_HOUR&&n.getMinutes()>=ALERT_MIN){
      const workers=getWrks(),recs=getRecs();
      const signed=new Set(recs.filter(r=>r.date===toDay()).map(r=>r.name));
      const unsigned=workers.filter(w=>!signed.has(w.name));
      if(unsigned.length>0){
        sendNotif("⚠️ ХАБЭА — Бүртгэлгүй ажилтан байна",
          `${unsigned.length} ажилтан гарын үсэг зураагүй:\n${unsigned.slice(0,3).map(w=>w.name).join(", ")}${unsigned.length>3?"...":""}`);
        localStorage.setItem(K.notif,todayKey);
      }
    }
  };
  setInterval(check,60000);check();
}

// ═══ SHEETS ═══
async function sendSheets(rec){
  const q=getQueue();
  q.push({payload:{action:"addRecord",...rec,passed:rec.passed?"Тэнцсэн":"Дутуу",instrRead:rec.instrRead?"Тийм":"Үгүй"},ts:Date.now(),attempts:0});
  saveQueue(q);await flushQueue();
}
async function syncWorkers(workers){
  try{await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"syncWorkers",workers})});}catch(e){}
}
async function flushQueue(){
  const q=getQueue();if(!q.length)return;
  const rem=[];
  for(const item of q){
    if(item.attempts>=5)continue;
    try{await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(item.payload)});}
    catch(e){item.attempts++;rem.push(item);}
  }
  saveQueue(rem);
}
function autoSaveWorker(w){
  if(!w.name)return;
  const ws=getWrks();
  const idx=ws.findIndex(x=>x.name===w.name);
  if(idx===-1)saveWrks([...ws,w]);
  else{ws[idx]={...ws[idx],...w};saveWrks(ws);}
}

// 🏠 НҮҮР
// ═══════════════════════════════════════════════════════════

  // Sheets-ээс өнөөдрийн бүртгэл татах
  fetchTodayRecs().catch(()=>{});
  const page=h("div",{className:"page home-bg center-page"});
  const inner=h("div",{className:"home-inner fadeUp"});
  inner.appendChild(brand(48,true));
  inner.appendChild(h("div",{style:{textAlign:"center",color:"rgba(255,255,255,.4)",fontSize:"10px",letterSpacing:".18em",textTransform:"uppercase",marginTop:"4px"}},["ХАБЭА бүртгэлийн систем"]));
  inner.appendChild(h("div",{className:"home-div"}));
  const bw=h("div",{style:{display:"flex",flexDirection:"column",gap:"10px",width:"100%"}});

  // Гарын үсэг товч — өдөрт 1 удаа лимиттэй

function renderPin(onOk,onBack){
  const app=document.getElementById("app");app.innerHTML="";
  let code="";
  const dots=Array.from({length:4},()=>el("div",{className:"pin-dot"}));
  function upd(){
    dots.forEach((d,i)=>{d.className="pin-dot"+(i<code.length?" on":"");});
    if(code.length===4)setTimeout(()=>{if(code===getPin())onOk();else{toast("Буруу PIN!","err");code="";upd();}},120);
  }
  function press(v){if(v==="del")code=code.slice(0,-1);else if(code.length<4)code+=v;upd();}
  const pad=el("div",{className:"pin-pad"});
  [1,2,3,4,5,6,7,8,9].forEach(n=>{const b=el("button",{className:"pin-btn"},[String(n)]);b.onclick=()=>press(String(n));pad.appendChild(b);});
  const be=el("button",{className:"pin-btn",style:{visibility:"hidden"}});
  const b0=el("button",{className:"pin-btn pin-0"},["0"]);b0.onclick=()=>press("0");
  const bd=el("button",{className:"pin-btn pin-del"},["⌫"]);bd.onclick=()=>press("del");
  pad.appendChild(be);pad.appendChild(b0);pad.appendChild(bd);
  const card=el("div",{className:"glass pin-card scaleIn"});
  card.appendChild(brand(22,false));
  card.appendChild(h("div",{style:{color:"var(--mut)",fontSize:"13px",marginTop:"8px",marginBottom:"4px"}},["Менежерийн PIN код"]));
  card.appendChild(el("div",{className:"pin-dots"},dots));
  card.appendChild(pad);
  const bb=el("button",{className:"btn btn-o",style:{marginTop:"16px"}},["← Буцах"]);bb.onclick=onBack;card.appendChild(bb);
  const pg=h("div",{className:"center-page",style:{background:"linear-gradient(160deg,var(--gd),var(--g) 70%)"}});
  pg.appendChild(card);app.appendChild(pg);
}

// ═══════════════════════════════════════════════════════════
// ✍️ АЖИЛТНЫ ФОРМ — 4 алхам + өдөрт 1 удаа лимит
// ═══════════════════════════════════════════════════════════
function renderWorkerForm(onDone,onBack){
  const app=document.getElementById("app");
  let step=0;
  const state={name:"",phone:"",position:"",department:"",instrRead:false,checked:new Set()};
  let sigCtx,sigCanvas,drawing=false,hasDrawn=false;
  const workers=getWrks();

  function render(){app.innerHTML="";app.appendChild(build());}

  function build(){
    const page=el("div",{className:"page",style:{background:"var(--gp)"}});
    const tb=h("div",{style:{background:"linear-gradient(135deg,var(--gd),var(--g))",padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}});
    const bb=el("button",{style:{background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.2)",color:"#fff",borderRadius:"8px",padding:"6px 12px",cursor:"pointer",fontSize:"13px",fontFamily:"inherit"}},["← Буцах"]);
    bb.onclick=step===0?onBack:()=>{step--;render();};
    const stepLabel=["Мэдээлэл","Зааварчилгаа","Шалгалт","Гарын үсэг"][step];
    tb.appendChild(bb);tb.appendChild(brand(16,true));
    tb.appendChild(h("div",{style:{fontSize:"11px",color:"rgba(255,255,255,.5)",textAlign:"right"}},[`${step+1}/4`,h("br"),stepLabel]));
    page.appendChild(tb);
    const si=h("div",{className:"step-ind"});
    [0,1,2,3].forEach(i=>si.appendChild(el("div",{className:"step-dot"+(i<step?" done":i===step?" cur":"")})));
    page.appendChild(si);
    const wrap=h("div",{style:{maxWidth:"480px",margin:"0 auto",padding:"0 16px 80px"}});
    if(step===0)wrap.appendChild(buildInfo());
    else if(step===1)wrap.appendChild(buildInstr());
    else if(step===2)wrap.appendChild(buildCheck());
    else wrap.appendChild(buildSig());
    page.appendChild(wrap);return page;
  }

  // STEP 0: МЭДЭЭЛЭЛ
  function buildInfo(){
    const div=el("div",{className:"fadeUp"});
    div.appendChild(h("div",{style:{fontFamily:"'DM Serif Display',serif",fontSize:"20px",color:"var(--g)",margin:"8px 0 4px"}},["Мэдээлэл оруулах"]));
    div.appendChild(h("div",{style:{fontSize:"12px",color:"var(--mut)",marginBottom:"14px"}},["Мэдээллээ бөглөнө үү"]));

    // Нэр + autocomplete
    const nw=el("div",{className:"inp-wrap"});
    nw.appendChild(h("div",{className:"inp-label"},["Ажилтны нэр *"]));
    const ni=el("input",{className:"inp",type:"text",placeholder:"Бүтэн нэрээ бичнэ үү",value:state.name});
    const sg=el("div",{className:"sugg-box",style:{display:"none"}});
    let _dept,_pos,_phone;
    ni.oninput=()=>{
      state.name=ni.value;
      const q=ni.value.toLowerCase();sg.innerHTML="";
      if(q.length>=1){
        const m=workers.filter(w=>w.name.toLowerCase().includes(q)).slice(0,6);
        if(m.length){sg.style.display="block";m.forEach(w=>{
          const it=el("div",{className:"sugg-item"},[w.name+(w.department?" — "+w.department:"")]);
          it.onclick=()=>{
            state.name=w.name;state.department=w.department||"";
            state.position=w.position||"";state.phone=w.phone||"";
            ni.value=w.name;
            if(_dept)_dept.value=w.department||"";
            if(_pos)_pos.value=w.position||"";
            if(_phone)_phone.value=w.phone||"";
            sg.style.display="none";
          };sg.appendChild(it);
        });}else sg.style.display="none";
      }else sg.style.display="none";
    };
    nw.appendChild(ni);nw.appendChild(sg);div.appendChild(nw);

    // Тасаг + Албан тушаал
    const g1=el("div",{className:"inp-grid"});
    const dw=el("div",{className:"inp-wrap",style:{margin:0}});
    dw.appendChild(h("div",{className:"inp-label"},["Тасаг / Хэлтэс *"]));
    const di=el("input",{className:"inp",type:"text",placeholder:"Тасгийн нэр",value:state.department});
    di.oninput=()=>{state.department=di.value;};_dept=di;dw.appendChild(di);
    const pw=el("div",{className:"inp-wrap",style:{margin:0}});
    pw.appendChild(h("div",{className:"inp-label"},["Албан тушаал *"]));
    const pi=el("input",{className:"inp",type:"text",placeholder:"Жишээ: Оператор",value:state.position});
    pi.oninput=()=>{state.position=pi.value;};_pos=pi;pw.appendChild(pi);
    g1.appendChild(dw);g1.appendChild(pw);div.appendChild(g1);

    // Утас
    const phw=el("div",{className:"inp-wrap",style:{marginTop:"8px"}});
    phw.appendChild(h("div",{className:"inp-label"},["Утасны дугаар"]));
    const phi=el("input",{className:"inp",type:"tel",placeholder:"99XXXXXX",value:state.phone});
    phi.oninput=()=>{state.phone=phi.value;};_phone=phi;phw.appendChild(phi);
    div.appendChild(phw);

    const nb=el("button",{className:"btn btn-p",style:{marginTop:"8px"}},["Үргэлжлүүлэх →"]);
    nb.onclick=()=>{
      if(!state.name.trim())return toast("Нэрийг оруулна уу","err");
      if(!state.department.trim())return toast("Тасгийг оруулна уу","err");
      if(!state.position.trim())return toast("Албан тушаалыг оруулна уу","err");
      // ── ӨДӨРТ 1 УДАА ЛИМИТ ──
      if(hasSignedToday(state.name.trim())){
        const app=document.getElementById("app");app.innerHTML="";
        const page=h("div",{className:"center-page",style:{background:"var(--gp)"}});
        const card=el("div",{className:"glass scaleIn",style:{maxWidth:"340px",width:"100%",padding:"32px",textAlign:"center"}});
        card.appendChild(h("div",{style:{fontSize:"48px",marginBottom:"12px"}},["✅"]));
        card.appendChild(brand(22,false));
        card.appendChild(h("div",{style:{fontFamily:"'DM Serif Display',serif",fontSize:"16px",color:"var(--g)",margin:"14px 0 6px"}},["Өнөөдөр аль хэдийн бүртгүүлсэн байна"]));
        card.appendChild(h("div",{style:{fontSize:"12px",color:"var(--mut)",marginBottom:"20px"}},[state.name.trim()+" та өнөөдрийн ХАБЭА бүртгэлд гарын үсэг зурсан байна."]));
        const btn=el("button",{className:"btn btn-p"},["Нүүр хуудас"]);btn.onclick=renderHome;card.appendChild(btn);
        page.appendChild(card);app.appendChild(page);
        return;
      }
      step=1;render();
    };
    div.appendChild(nb);return div;
  }

  // STEP 1: ЗААВАРЧИЛГАА
  function buildInstr(){
    const div=el("div",{className:"fadeUp"});
    const card=el("div",{className:"card",style:{marginTop:"8px"}});
    card.appendChild(h("div",{className:"card-head"},["📋 Аюулгүй ажиллагааны санамж"]));
    INSTRUCTIONS.forEach((txt,i)=>{
      const r=h("div",{className:"instr-item"});
      r.appendChild(h("div",{className:"instr-num"},[String(i+1)]));
      r.appendChild(h("div",{className:"instr-txt"},[txt]));
      card.appendChild(r);
    });
    const cw=el("div",{className:"confirm-wrap"});
    const cb=el("div",{className:"confirm-box"+(state.instrRead?" on":"")});
    if(state.instrRead)cb.innerHTML=chk();
    cw.appendChild(cb);cw.appendChild(h("div",{style:{fontSize:"13px",fontWeight:"700"}},["Санамжийг уншиж танилцсан"]));
    cw.onclick=()=>{state.instrRead=!state.instrRead;cb.className="confirm-box"+(state.instrRead?" on":"");cb.innerHTML=state.instrRead?chk():"";};
    card.appendChild(cw);div.appendChild(card);
    const nb=el("button",{className:"btn btn-p",style:{marginTop:"4px"}},["Үргэлжлүүлэх →"]);
    nb.onclick=()=>{if(!state.instrRead)return toast("Санамжийг уншсанаа тэмдэглэнэ үү","err");step=2;render();};
    div.appendChild(nb);return div;
  }

  // STEP 2: ЧЕКЛИСТ
  function buildCheck(){
    const div=el("div",{className:"fadeUp"});
    const card=el("div",{className:"card",style:{marginTop:"8px"}});
    card.appendChild(h("div",{className:"card-head"},["✅ Өдрийн шалгах хуудас"]));
    CHECKLIST.forEach(g=>{
      card.appendChild(h("div",{className:"check-cat"},[g.cat]));
      g.items.forEach(item=>{
        const r=el("div",{className:"check-item"});
        const b=el("div",{className:"check-box"+(state.checked.has(item)?" on":"")});
        if(state.checked.has(item))b.innerHTML=chk();
        r.appendChild(b);r.appendChild(h("div",{className:"check-txt"},[item]));
        r.onclick=()=>{if(state.checked.has(item)){state.checked.delete(item);b.className="check-box";b.innerHTML="";}else{state.checked.add(item);b.className="check-box on";b.innerHTML=chk();}};
        card.appendChild(r);
      });
    });
    const pg=el("div",{style:{marginTop:"12px",padding:"10px 12px",background:"var(--gp)",borderRadius:"10px",fontSize:"12px",color:"var(--mut)"}});
    pg.textContent=`${state.checked.size} / ${ALL_ITEMS.length} биелүүлсэн`;
    card.appendChild(pg);div.appendChild(card);
    const nb=el("button",{className:"btn btn-p",style:{marginTop:"4px"}},["Гарын үсэг зурах →"]);
    nb.onclick=()=>{step=3;render();};div.appendChild(nb);return div;
  }

  // STEP 3: ГАРЫН ҮСЭГ
  function buildSig(){
    const div=el("div",{className:"fadeUp"});
    const card=el("div",{className:"card",style:{marginTop:"8px"}});
    card.appendChild(h("div",{className:"card-head"},["✍️ Гарын үсэг"]));
    const so=el("div",{className:"sig-outer",style:{height:"160px"}});
    const hint=h("div",{className:"sig-hint"},["Энд гарын үсгээ зурна уу"]);
    sigCanvas=el("canvas",{style:{display:"block",width:"100%",height:"160px"}});
    const clr=el("button",{className:"sig-clear"},["Арилгах"]);
    so.appendChild(sigCanvas);so.appendChild(hint);so.appendChild(clr);card.appendChild(so);
    setTimeout(()=>{
      sigCanvas.width=so.offsetWidth;sigCanvas.height=160;
      sigCtx=sigCanvas.getContext("2d");sigCtx.strokeStyle="#1a2e1f";sigCtx.lineWidth=2.5;sigCtx.lineCap="round";sigCtx.lineJoin="round";
      function pos(e){const r=sigCanvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*(sigCanvas.width/r.width),(t.clientY-r.top)*(sigCanvas.height/r.height)];}
      sigCanvas.addEventListener("mousedown",e=>{drawing=true;const[x,y]=pos(e);sigCtx.beginPath();sigCtx.moveTo(x,y);});
      sigCanvas.addEventListener("mousemove",e=>{if(!drawing)return;hasDrawn=true;hint.style.opacity="0";const[x,y]=pos(e);sigCtx.lineTo(x,y);sigCtx.stroke();});
      sigCanvas.addEventListener("mouseup",()=>{drawing=false;});
      sigCanvas.addEventListener("touchstart",e=>{e.preventDefault();drawing=true;const[x,y]=pos(e);sigCtx.beginPath();sigCtx.moveTo(x,y);},{passive:false});
      sigCanvas.addEventListener("touchmove",e=>{e.preventDefault();if(!drawing)return;hasDrawn=true;hint.style.opacity="0";const[x,y]=pos(e);sigCtx.lineTo(x,y);sigCtx.stroke();},{passive:false});
      sigCanvas.addEventListener("touchend",()=>{drawing=false;});
    },0);
    clr.onclick=()=>{if(!sigCtx)return;sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);hint.style.opacity="1";hasDrawn=false;};
    const passed=state.checked.size>=Math.floor(ALL_ITEMS.length*0.8);
    const sm=el("div",{style:{marginTop:"12px",padding:"12px",background:"var(--gp)",borderRadius:"12px",fontSize:"12px"}});
    sm.innerHTML=`<b style="color:var(--g)">${state.name}</b> — ${state.position} | ${state.department}<br>Шалгалт: <b style="color:${passed?"var(--g)":"#e74c3c"}">${state.checked.size}/${ALL_ITEMS.length} ${passed?"✅ Тэнцсэн":"⚠️ Дутуу"}</b><br>${toDay()} ${toNow()}`;
    card.appendChild(sm);div.appendChild(card);
    const sb=el("button",{className:"btn btn-p",style:{marginTop:"4px"}},["Бүртгүүлэх ✓"]);
    sb.onclick=async()=>{
      if(!hasDrawn)return toast("Гарын үсгээ зурна уу","err");
      sb.textContent="Хадгалж байна...";sb.disabled=true;
      const rec={name:state.name.trim(),department:state.department.trim(),position:state.position.trim(),phone:state.phone.trim(),date:toDay(),time:toNow(),passed,instrRead:state.instrRead,checkedCount:state.checked.size,signature:sigCanvas.toDataURL("image/png")};
      const recs=getRecs();recs.push(rec);saveRecs(recs);
      autoSaveWorker({name:rec.name,department:rec.department,position:rec.position,phone:rec.phone});
      await sendSheets(rec);
      onDone(rec);
    };
    div.appendChild(sb);return div;
  }
  render();
}

// ═══════════════════════════════════════════════════════════
// 🛡️ МЕНЕЖЕР
// ═══════════════════════════════════════════════════════════
function renderManager(onLogout){
  const app=document.getElementById("app");
  let tab="today",selDate=toDay();
  let rt=setInterval(()=>{if(tab==="today")render();},8000);

  function ms(lbl,val,ico){return h("div",{className:"stat-box"},[h("div",{className:"stat-ico"},[ico]),h("div",{className:"stat-val",style:{fontSize:"20px"}},[String(val)]),h("div",{className:"stat-lbl"},[lbl])]);}

  function render(){
    // Sheets-ээс шинэчлэх
    if(tab==="today"){
      fetchTodayRecs().then(()=>{app.innerHTML="";app.appendChild(build());}).catch(()=>{app.innerHTML="";app.appendChild(build());});
    } else {
      app.innerHTML="";app.appendChild(build());
    }
  }

  function build(){
    const recs=getRecs(),workers=getWrks();
    const todayRecs=recs.filter(r=>r.date===toDay());
    const signedSet=new Set(todayRecs.map(r=>r.name));
    const unsigned=workers.filter(w=>!signedSet.has(w.name));
    const dateRecs=recs.filter(r=>r.date===selDate);
    const TABS=[{id:"today",l:"📊 Өнөөдөр"},{id:"report",l:"📋 Тайлан"},{id:"workers",l:"👥 Ажилтан"},{id:"settings",l:"⚙️ Тохиргоо"}];

    const page=el("div",{className:"page"});
    const hdr=el("div",{className:"mgr-hdr"});
    const ht=h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"10px"}});
    ht.appendChild(h("div",{style:{display:"flex",alignItems:"center",gap:"8px"}},[brand(18,true),h("div",{style:{color:"rgba(255,255,255,.4)",fontSize:"10px",letterSpacing:".08em"}},["МЕНЕЖЕР"])]));
    const rfr=el("button",{style:{background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.15)",color:"#fff",borderRadius:"8px",padding:"6px 10px",cursor:"pointer",fontSize:"13px"}},["🔄"]);rfr.onclick=render;
    const out=el("button",{style:{background:"#e74c3c",border:"none",color:"#fff",borderRadius:"8px",padding:"6px 12px",cursor:"pointer",fontSize:"12px",fontWeight:"700",fontFamily:"inherit"}},["← Гарах"]);out.onclick=()=>{clearInterval(rt);onLogout();};
    ht.appendChild(h("div",{style:{display:"flex",gap:"6px"}},[rfr,out]));hdr.appendChild(ht);
    const tr=el("div",{className:"mgr-tabs"});
    TABS.forEach(t=>{const b=el("button",{className:"mgr-tab"+(tab===t.id?" on":"")});b.textContent=t.l;b.onclick=()=>{tab=t.id;render();};tr.appendChild(b);});
    hdr.appendChild(tr);page.appendChild(hdr);
    const body=el("div",{className:"mgr-body"});

    // ── ӨНӨӨДӨР ──
    if(tab==="today"){
      if(Notification.permission==="default"){
        const nb=el("div",{className:"n-banner fadeUp"});
        nb.innerHTML='🔔 <span style="flex:1">09:15-д браузер анхааруулга авах</span>';
        const nbb=el("button",{className:"btn btn-p btn-sm"},["Зөвшөөрөх"]);
        nbb.onclick=()=>reqNotif().then(()=>render());nb.appendChild(nbb);body.appendChild(nb);
      }
      const sr=el("div",{className:"stat-row fadeUp"});
      [{l:"Нийт",v:workers.length,i:"👥",c:"var(--ink)"},{l:"Бүртгэгдсэн",v:todayRecs.length,i:"✅",c:"var(--g)"},{l:"Бүртгэлгүй",v:unsigned.length,i:"⚠️",c:"#d35400"}].forEach(s=>{
        const b=el("div",{className:"stat-box"});b.appendChild(h("div",{className:"stat-ico"},[s.i]));b.appendChild(h("div",{className:"stat-val",style:{color:s.c}},[String(s.v)]));b.appendChild(h("div",{className:"stat-lbl"},[s.l]));sr.appendChild(b);
      });body.appendChild(sr);
      const sc=el("div",{className:"card fadeUp"});
      sc.appendChild(h("div",{className:"card-head"},["✅ Бүртгэгдсэн — "+todayRecs.length]));
      if(!todayRecs.length)sc.appendChild(h("div",{style:{color:"var(--mut)",fontSize:"13px",padding:"12px 0",textAlign:"center"}},["Одоогоор бүртгэл байхгүй"]));
      else todayRecs.forEach(r=>{
        const row=el("div",{className:"w-row"});
        row.appendChild(el("div",{className:"w-av"},[initials(r.name)]));
        row.appendChild(h("div",{style:{flex:"1"}},[h("div",{className:"w-name"},[r.name]),h("div",{className:"w-sub"},[(r.position||r.department)+" — "+r.time])]));
        if(r.signature&&r.signature!=="signed")row.appendChild(el("img",{src:r.signature,className:"w-sig"}));
        else row.appendChild(h("div",{style:{color:"var(--g)",fontSize:"16px"}},["✓"]));
        sc.appendChild(row);
      });
      body.appendChild(sc);
      if(unsigned.length>0){
        const uc=el("div",{className:"card fadeUp"});
        uc.appendChild(h("div",{className:"card-head",style:{color:"#d35400"}},["⚠️ Бүртгүүлээгүй — "+unsigned.length]));
        unsigned.forEach(w=>{const row=el("div",{className:"w-row"});row.appendChild(el("div",{className:"w-av",style:{background:"linear-gradient(135deg,#e67e22,#d35400)"}},[initials(w.name)]));row.appendChild(h("div",{style:{flex:"1"}},[h("div",{className:"w-name"},[w.name]),h("div",{className:"w-sub"},[(w.position||"")+" • "+(w.department||"")])]));row.appendChild(el("div",{className:"badge bg-o"},["Бүртгэлгүй"]));uc.appendChild(row);});
        body.appendChild(uc);
      }
      body.appendChild(el("a",{href:SHEET_URL,target:"_blank",style:{display:"block",textAlign:"center",color:"var(--g)",fontSize:"12px",marginTop:"8px",textDecoration:"none",fontWeight:"700"}},["📊 Google Sheets →"]));
    }

    // ── ТАЙЛАН ──
    else if(tab==="report"){
      const dc=el("div",{className:"card fadeUp"});
      dc.appendChild(h("div",{className:"card-head"},["📋 Бүртгэлийн тайлан"]));
      const dr=h("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"14px"}},[h("div",{style:{fontSize:"12px",color:"var(--mut)",fontWeight:"700"}},["Огноо:"])]);
      const di=el("input",{style:{padding:"8px 12px",border:"1.5px solid var(--bdr)",borderRadius:"10px",fontSize:"13px",fontFamily:"'DM Sans',sans-serif",color:"var(--ink)",background:"var(--wh)",outline:"none"},type:"date",value:selDate.split(".").reverse().join("-")});
      di.onchange=()=>{const d=new Date(di.value);selDate=d.toLocaleDateString("mn-MN",{year:"numeric",month:"2-digit",day:"2-digit"});render();};
      dr.appendChild(di);dc.appendChild(dr);
      const passed=dateRecs.filter(r=>r.passed).length;
      dc.appendChild(h("div",{style:{display:"flex",gap:"8px",marginBottom:"14px"}},[ms("Нийт",dateRecs.length,"#"),ms("Тэнцсэн",passed,"✅"),ms("Дутуу",dateRecs.length-passed,"⚠️")]));
      if(!dateRecs.length)dc.appendChild(h("div",{style:{color:"var(--mut)",fontSize:"13px",padding:"12px 0",textAlign:"center"}},["Тус өдрийн бүртгэл байхгүй"]));
      else{
        const th=el("div",{className:"rep-row",style:{borderBottom:"2px solid var(--bdr)",fontWeight:"700",color:"var(--mut)",fontSize:"11px",textTransform:"uppercase"}});
        ["Нэр","Тасаг","Цаг","Үр дүн"].forEach((t,i)=>{th.appendChild(h("div",{style:{flex:[2,2,1,1][i]||1,textAlign:i===3?"right":"left"}},[t]));});
        dc.appendChild(th);
        dateRecs.forEach(r=>{
          const row=el("div",{className:"rep-row"});
          row.appendChild(h("div",{style:{flex:2,fontWeight:"700"}},[r.name]));
          row.appendChild(h("div",{style:{flex:2,color:"var(--mut)"}},[r.department]));
          row.appendChild(h("div",{style:{flex:1,color:"var(--mut)"}},[r.time]));
          row.appendChild(h("div",{style:{flex:1,textAlign:"right"}},[el("div",{className:"badge "+(r.passed?"bg-g":"bg-o")},[r.passed?"Тэнцсэн":"Дутуу"])]));
          dc.appendChild(row);
        });
      }
      body.appendChild(dc);
    }

    // ── АЖИЛТАН ──
    else if(tab==="workers"){
      const wc=el("div",{className:"card fadeUp"});
      wc.appendChild(h("div",{className:"card-head"},["👥 Ажилтнууд ("+workers.length+")"]));
      const ag=el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px",marginBottom:"6px"}});
      const nn=el("input",{className:"inp",type:"text",placeholder:"Нэр"});
      const nd=el("input",{className:"inp",type:"text",placeholder:"Тасаг"});
      const np=el("input",{className:"inp",type:"text",placeholder:"Албан тушаал",style:{marginBottom:"6px"}});
      const nph=el("input",{className:"inp",type:"tel",placeholder:"Утас",style:{marginBottom:"8px"}});
      ag.appendChild(nn);ag.appendChild(nd);wc.appendChild(ag);
      wc.appendChild(np);wc.appendChild(nph);
      const ab=el("button",{className:"btn btn-p btn-sm",style:{margin:"4px 0 16px"}},["+ Ажилтан нэмэх"]);
      ab.onclick=()=>{
        if(!nn.value.trim()||!nd.value.trim()||!np.value.trim())return toast("Нэр, тасаг, тушаалыг оруулна уу","err");
        const ws=getWrks();
        if(ws.find(w=>w.name===nn.value.trim()))return toast("Аль хэдийн бүртгэлтэй","info");
        const nw={name:nn.value.trim(),department:nd.value.trim(),position:np.value.trim(),phone:nph.value.trim()};
        const upd=[...ws,nw];saveWrks(upd);syncWorkers(upd);toast("Нэмэгдлээ ✓");render();
      };
      wc.appendChild(ab);
      if(!workers.length)wc.appendChild(h("div",{style:{color:"var(--mut)",fontSize:"13px",padding:"8px 0",textAlign:"center"}},["Ажилтан байхгүй"]));
      else workers.forEach((w,i)=>{
        const row=el("div",{className:"w-row"});
        row.appendChild(el("div",{className:"w-av"},[initials(w.name)]));
        row.appendChild(h("div",{style:{flex:"1"}},[
          h("div",{className:"w-name"},[w.name]),
          h("div",{className:"w-sub"},[w.position+" | "+w.department]),
          w.phone?h("div",{className:"w-sub"},["📞 "+w.phone]):null
        ]));
        const db=el("button",{className:"btn btn-d btn-sm"},["✕"]);
        db.onclick=()=>{const ws=getWrks();ws.splice(i,1);saveWrks(ws);syncWorkers(ws);toast("Устгагдлаа");render();};
        row.appendChild(db);wc.appendChild(row);
      });
      body.appendChild(wc);
    }

    // ── ТОХИРГОО ──
    else if(tab==="settings"){
      const sc=el("div",{className:"card fadeUp"});
      sc.appendChild(h("div",{className:"card-head"},["⚙️ Тохиргоо"]));
      sc.appendChild(h("div",{style:{fontSize:"13px",fontWeight:"700",marginBottom:"6px"}},["PIN код солих"]));
      const pi=el("input",{className:"inp",type:"password",maxlength:"4",placeholder:"Шинэ PIN (4 тоо)",style:{marginBottom:"8px"}});
      const pb=el("button",{className:"btn btn-p btn-sm"},["Хадгалах"]);
      pb.onclick=()=>{if(pi.value.length<4)return toast("4 оронтой PIN оруулна уу","err");savePin(pi.value);toast("PIN солигдлоо ✓");pi.value="";};
      sc.appendChild(pi);sc.appendChild(pb);
      sc.appendChild(h("div",{style:{fontSize:"13px",fontWeight:"700",margin:"16px 0 6px"}},[
        "Браузер анхааруулга (09:15) — ",
        el("span",{className:"badge "+(Notification.permission==="granted"?"bg-g":Notification.permission==="denied"?"bg-r":"bg-b")},
          [Notification.permission==="granted"?"✓ Идэвхтэй":Notification.permission==="denied"?"✗ Хаалттай":"Тохируулаагүй"])
      ]));
      if(Notification.permission!=="granted"){const nb=el("button",{className:"btn btn-p btn-sm"},["Зөвшөөрөх"]);nb.onclick=()=>reqNotif().then(()=>render());sc.appendChild(nb);}
      sc.appendChild(h("div",{style:{fontSize:"13px",fontWeight:"700",margin:"16px 0 6px"}},["Бүртгэл устгах"]));
      const cb=el("button",{className:"btn btn-d btn-sm"},["Бүртгэл устгах"]);
      cb.onclick=()=>{if(confirm("Бүх бүртгэлийн мэдээлэл устгах уу?")){saveRecs([]);toast("Устгагдлаа","info");render();}};
      sc.appendChild(cb);
      body.appendChild(sc);
    }

    page.appendChild(body);return page;
  }
  render();
}

renderHome();

</script>
</body>
</html>
