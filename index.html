<div id="app"></div>
<script>
// ════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygQOi-y76ikqCXkAfzNF9hnnS5C3JsxL6mlFdA1vPdI6mfmrejOXIcZncFouLB1izo/exec";
const SHEET_URL  = "https://docs.google.com/spreadsheets/d/1OB8ejIU4RxtuyelQpQVT5PSL6aWWt2gJbx9lo8dhTaU/edit";
const APP_URL    = "https://ulziibatbaatar-tech.github.io/bestshoes-habea/";
const ALERT_HOUR = 9, ALERT_MIN = 15;
const HAZARD_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdISoAU5VIJUJBfglhL7XJPm0UehKk83x7Tca6o-iRX50R8yg/viewform";
const HAZARD_RESPONSES_URL = "https://docs.google.com/spreadsheets/d/1rQceNzFbJiXu6SmzwuibMQ3VIcP0OSgz4TZYpKuaZ8w/edit";
const HAZARD_NOTIF_KEY = "habea_hazard_notifs_v1";
const DEFAULT_PIN = "9761";
const DEFAULT_PASS_PCT = 80;
const DEPTS = ["Гүйцэтгэл","Оёдол","Гоёл","Санхүү","Эсгүүр","Захиргаа"];

// ════════════ PIN SHA-256 ════════════
async function hashPin(pin){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("habea_pin_salt_"+pin));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function normName(n){return(n||"").trim().toLowerCase();}

// ════════════ STORAGE ════════════
const K={
  recs:"habea_recs_v5",
  wrks:"habea_wrks_v3",
  pin:"habea_pin_v2",
  queue:"habea_queue_v1",
  notif:"habea_notif_v1",
  cfg:"habea_cfg_v1",
  instr:"habea_instr_v1",
  blacklist:"habea_blacklist_v1",  // хаагдсан ажилтны жагсаалт
  newworkers:"habea_newworkers_v1" // шинэ ажилтны timestamp жагсаалт {name, ts}
};
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch{return null;}};
const lsSet=(k,v)=>{
  try{localStorage.setItem(k,JSON.stringify(v));}
  catch(e){
    if(e.name==="QuotaExceededError"||e.code===22){
      try{
        const recs=JSON.parse(localStorage.getItem("habea_recs_v5")||"[]");
        recs.forEach(r=>{if(r.signature&&r.signature!=="signed")r.signature="signed";});
        localStorage.setItem("habea_recs_v5",JSON.stringify(recs));
        localStorage.setItem(k,JSON.stringify(v));
        toast("Санах ой дүүрч байсан тул хуучин гарын үсгийг цэвэрлэлээ","info");
      }catch(e2){toast("Санах ой дүүрсэн байна! Хуучин бүртгэлийг цэвэрлэнэ үү","err");}
    }
  }
};
const getRecs  =()=>lsGet(K.recs)||[];
const saveRecs =v=>lsSet(K.recs,v);
const getWrks  =()=>lsGet(K.wrks)||[];
const saveWrks =v=>lsSet(K.wrks,v);
const getQueue =()=>lsGet(K.queue)||[];

// Бүтэц: [{name, department, deletedAt, reason}]
const getBlacklist = () => lsGet(K.blacklist) || [];
const saveBlacklist = v => lsSet(K.blacklist, v);

function addToBlacklist(worker) {
  const bl = getBlacklist();
  const key = normName(worker.name);
  if (!bl.find(b => normName(b.name) === key)) {
    bl.push({
      name: worker.name,
      department: worker.department || "",
      position: worker.position || "",
      deletedAt: toDay(),
      deletedTs: Date.now()  // 72 цагийн тооллого эхлэх timestamp
    });
    saveBlacklist(bl);
  }
}

// 72 цагийн дараа blacklist-ийн ажилтнуудыг бүрэн устгах
function pruneBlacklist() {
  const HOURS_72 = 72 * 60 * 60 * 1000;
  const now = Date.now();
  const bl = getBlacklist();
  const remaining = bl.filter(b => {
    if (!b.deletedTs) return true; // timestamp байхгүй бол хэвээр үлдэнэ
    return (now - b.deletedTs) < HOURS_72;
  });
  if (remaining.length !== bl.length) {
    saveBlacklist(remaining);
    // Ажилтны жагсаалтаас бас устгагдсан эсэхийг шалгах
    const ws = getWrks();
    const removed = bl.filter(b => b.deletedTs && (now - b.deletedTs) >= HOURS_72);
    let changed = false;
    removed.forEach(b => {
      const idx = ws.findIndex(w => normName(w.name) === normName(b.name));
      if (idx > -1) { ws.splice(idx, 1); changed = true; }
    });
    if (changed) { saveWrks(ws); syncWorkers(ws); }
  }
}

function removeFromBlacklist(name) {
  const bl = getBlacklist().filter(b => normName(b.name) !== normName(name));
  saveBlacklist(bl);
}

function isBlacklisted(name) {
  return getBlacklist().some(b => normName(b.name) === normName(name));
}

function isNewWorker(name) {

function pruneNewWorkers() {

function _pad(n){return String(n).padStart(2,"0");}
// Улаанбаатарын цаг — toLocaleString аргаар
// Бүх браузер, бүх timezone-д найдвартай ажилладаг
function _getUBDate(){
  // "2026/05/23 09:34" хэлбэрт авна
  const s=new Date().toLocaleString("sv-SE",{timeZone:"Asia/Ulaanbaatar"});
  // sv-SE locale → "2026-05-23 09:34:01" стандарт формат
  const [datePart,timePart]=s.split(" ");
  const [year,month,day]=datePart.split("-");
  const [hour,minute]=timePart.split(":");
  return{year,month,day,hour,minute};
}
function toDay(){
  const p=_getUBDate();
  return `${p.year}.${p.month}.${p.day}`;
}
function toNow(){
  const p=_getUBDate();
  return `${p.hour}:${p.minute}`;
}
function mnToISO(mnDate){
  if(!mnDate)return "";
  const parts=mnDate.split(".");
  if(parts.length===3){const [y,m,d]=parts;return `${y.padStart(4,"0")}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;}
  return "";
}
function isoToMn(isoDate){
  if(!isoDate)return toDay();
  const parts=isoDate.split("-");
  if(parts.length!==3)return toDay();
  const [y,m,d]=parts;
  if(!y||!m||!d)return toDay();
  return `${y}.${_pad(parseInt(m))}.${_pad(parseInt(d))}`;
}
function initials(n){if(!n)return"?";return n.trim().split(/\s+/).slice(0,2).map(p=>p[0]||"").join("").toUpperCase()||"?";}
function chk(){return '<svg width="11" height="9" viewBox="0 0 11 9" fill="none"><polyline points="1,4.5 4,7.5 10,1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function hasSignedToday(name){return getRecs().some(r=>normName(r.name)===normName(name)&&r.date===toDay());}

function el(tag,props,kids){
  const e=document.createElement(tag);
  for(const k in props||{}){
    if(k==="className")e.className=props[k];
    else if(k==="style"&&typeof props[k]==="object")Object.assign(e.style,props[k]);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),props[k]);
    else if(k==="disabled"&&props[k])e.disabled=true;
    else e.setAttribute(k,props[k]);
  }
  (kids||[]).flat().forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});
  return e;
}
function h(tag,p,...c){return el(tag,p,c);}
let _tt;
function toast(msg,type){
  document.querySelectorAll(".toast").forEach(t=>t.remove());clearTimeout(_tt);
  const t=el("div",{className:"toast",style:{background:type==="err"?"#c0392b":type==="info"?"#2474a8":"#1a6a3a"}},[msg]);
  document.body.appendChild(t);_tt=setTimeout(()=>t.remove(),3500);
}

let _alertInterval=null;
function startAlertTimer(){
  if(_alertInterval)return;
  const todayKey="notif_"+toDay();
  if(localStorage.getItem(K.notif)===todayKey)return;
  const check=()=>{
    const _ubp=_getUBDate();
    const _ubH=parseInt(_ubp.hour);
    const _ubM=parseInt(_ubp.minute);
    const _ac=getCfg();const _ah=_ac.alertHour||ALERT_HOUR;const _am=_ac.alertMin||ALERT_MIN;
    if(_ubH===_ah&&_ubM>=_am){
      const workers=getWrks(),recs=getRecs();
      const signed=new Set(recs.filter(r=>r.date===toDay()).map(r=>normName(r.name)));
      const unsigned=workers.filter(w=>!signed.has(normName(w.name)));
      if(unsigned.length>0){
        sendNotif("⚠️ ХАБЭА — Бүртгэлгүй ажилтан байна",
          `${unsigned.length} ажилтан гарын үсэг зураагүй:\n${unsigned.slice(0,3).map(w=>w.name).join(", ")}${unsigned.length>3?"...":""}`);

        clearInterval(_alertInterval);_alertInterval=null;
      }
    }
  };

}

async function postToSheets(payload){
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)});
    return await res.json();
  }catch(e){return{ok:false,error:e.message};}
}
async function getFromSheets(params){
  try{
    const qs=Object.entries(params).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join("&");
    const res=await fetch(`${SCRIPT_URL}?${qs}`);
    return await res.json();
  }catch(e){return{ok:false,error:e.message};}
}
async function sendSheets(rec){
  const q=getQueue();
  // time-г LocalStorage-ийн хуучин утгаар биш
  // гарын үсэг зурсан үеийн БОДИТ цагаар баталгаажуулах
  const safeRec={
    ...rec,
    passed:   rec.passed?"Тэнцсэн":"Дутуу",
    instrRead:rec.instrRead?"Тийм":"Үгүй",
    // Цаг: rec.time байвал ашиглах, эс бол одоогийн цаг
    time: rec.time && /^\d{1,2}:\d{2}$/.test(String(rec.time).trim())
      ? rec.time
      : toNow()
  };
  q.push({payload:{action:"addRecord",...safeRec},ts:Date.now(),attempts:0});
  saveQueue(q);await flushQueue();
}
async function flushQueue(){
  const q=getQueue();if(!q.length)return;
  const rem=[];
  for(const item of q){
    if(item.attempts>=5)continue;
    const result=await postToSheets(item.payload);
    if(!result.ok){item.attempts++;rem.push(item);}
  }
  saveQueue(rem);
}
async function syncWorkers(workers){await postToSheets({action:"syncWorkers",workers});}
async function fetchTodayFromSheets(date){
  const res=await getFromSheets({action:"getToday",date:date||toDay()});
  if(!res||!res.ok||!Array.isArray(res.records))return[];
  return res.records;
}
async function fetchWorkersFromSheets(){
  const res=await getFromSheets({action:"getWorkers"});
  if(!res||!res.ok||!Array.isArray(res.workers))return null;
  return res.workers;
}

// ── Цагийг "HH:MM" хэлбэрт аюулгүй хөрвүүлэх ──
// Цагийг "HH:MM" хэлбэрт аюулгүй хөрвүүлэх
function safeTime(val){
  if(!val)return"";
  const s=String(val).trim();
  // 1. "HH:MM" хэлбэр → шууд буцаах
  if(/^\d{1,2}:\d{2}$/.test(s))return s.padStart(5,"0");
  // 2. "HH:MM:SS" → "HH:MM"
  if(/^\d{1,2}:\d{2}:\d{2}$/.test(s))return s.substring(0,5);
  // 3. "Sat Dec 30 1899 HH:MM:SS GMT+HHMM..." Date string
  // GMT offset хасаж UTC авна: local - offset = UTC
  // Apps Script Utilities.formatDate ашигласан тул энэ хэлбэр ирэхгүй
  // Гэхдээ хуучин өгөгдөлд байж болно — засаж харуулна
  const gmtMatch=s.match(/(\d{1,2}):(\d{2}):\d{2}\s+GMT([+-])(\d{2})(\d{2})/);
  if(gmtMatch){
    const lh=parseInt(gmtMatch[1]),lm=parseInt(gmtMatch[2]);
    const sign=gmtMatch[3]==='+'?1:-1;
    const tzh=parseInt(gmtMatch[4]),tzm=parseInt(gmtMatch[5]);
    // UTC минут
    let utc=(lh*60+lm)-sign*(tzh*60+tzm);
    utc=((utc%1440)+1440)%1440;
    // Монгол цаг UTC+8
    const mn=((utc+8*60)%1440+1440)%1440;
    // Хэрэв 09:25 орчим байвал шууд local цагийг авна (ойролцоо тооцоо)
    // Практикт: string дахь цагийг UTC+7:07 гэж тооцоолоод UTC авч UB нэмнэ
    const h=String(Math.floor(mn/60)).padStart(2,"0");
    const m=String(mn%60).padStart(2,"0");
    return h+":"+m;
  }
  return"";
}
function mergeRecords(local,remote){
  // ── Цагийн хүчинтэй эсэх шалгах ──
  // Ажлын цаг: 07:00-18:00 → зөв
  // 00:xx-06:xx, 19:xx-23:xx → Sheets-д буруу UTC цаг хадгалагдсан
  function isGoodTime(t){
    if(!t)return false;
    const s=String(t).trim();
    if(!/^\d{1,2}:\d{2}$/.test(s))return false;
    const h=parseInt(s.split(":")[0]);
    return h>=8&&h<=19; // Ажлын цаг 08:00-19:00
  }

  // UTC→UB засвар хийх
  function fixUtcTime(t){
    if(!t)return t;
    const s=String(t).trim();
    if(!/^\d{1,2}:\d{2}$/.test(s))return t;
    const h=parseInt(s.split(":")[0]);
    const m=s.split(":")[1];
    if(h>=0&&h<=7){
      // UTC+0 эсвэл UTC+1 цаг → +8 нэмж UB болгох
      const ubH=(h+8)%24;
      return String(ubH).padStart(2,"0")+":"+m;
    }
    return t;
  }

  const localMap={};
  local.forEach(r=>{localMap[normName(r.name)+"_"+r.date]=r;});

  const remoteMap={};
  remote.forEach(r=>{
    const key=normName(r.name)+"_"+r.date;
    let t=safeTime(r.time);
    // Буруу UTC цаг байвал засна
    if(!isGoodTime(t)) t=fixUtcTime(t);
    remoteMap[key]={...r,time:t};
  });

  const merged=[];
  const seen=new Set();

  Object.entries(remoteMap).forEach(([key,r])=>{
    seen.add(key);
    const loc=localMap[key];
    if(loc){
      let bestTime=r.time;
      const remoteGood=isGoodTime(r.time);
      const localGood=isGoodTime(loc.time);
      // Local зөв цаг байвал ҮРГЭЛЖ local давуу
      // Remote буруу UTC цаг байвал local авна
      if(localGood&&!remoteGood) bestTime=loc.time;
      else if(remoteGood&&!localGood) bestTime=r.time;
      else if(localGood&&remoteGood) bestTime=loc.time; // ХОЁУЛАА ЗӨВ → LOCAL ДАВУУ
      else bestTime=loc.time||r.time;
      merged.push({...r,time:bestTime,signature:loc.signature||r.signature||"signed"});
    }else{
      merged.push(r);
    }
  });

  Object.entries(localMap).forEach(([key,r])=>{
    if(!seen.has(key)){seen.add(key);merged.push(r);}
  });

  return merged;
}
function autoSaveWorker(w){
  if(!w.name)return;
  // Хар жагсаалтад байвал автоматаар хадгалахгүй
  if(isBlacklisted(w.name))return;
  const ws=getWrks();
  const idx=ws.findIndex(x=>normName(x.name)===normName(w.name));
  if(idx===-1){
    // ── Шинэ ажилтан: хадгалж, 🆕 тэмдэглэнэ ──
    saveWrks([...ws,w]);
    markAsNew(w.name);
    syncWorkers([...ws,w]); // Sheets-тэй синк — шинэ ажилтан нэмэгдлээ
  }else{
    // ── Байгаа ажилтан: утас болон бусад мэдээллийг шинэчлэх ──
    const updated={...ws[idx]};
    if(w.phone&&w.phone.trim())updated.phone=w.phone.trim(); // утас шинэчлэх
    if(w.position&&w.position.trim())updated.position=w.position.trim();
    if(w.department&&w.department.trim())updated.department=w.department.trim();
    ws[idx]=updated;
    saveWrks(ws);
  }
}
function pruneOldSignatures(){
  try{
    const recs=getRecs();
    const cutoff=Date.now()-30*24*60*60*1000;
    let changed=false;
    recs.forEach(r=>{
      // Гарын үсгийн санах ой цэвэрлэх
      if(r.signature&&r.signature!=="signed"){
        const iso=mnToISO(r.date);
        if(iso){const d=new Date(iso);if(d.getTime()<cutoff){r.signature="signed";changed=true;}}
      }
      // Буруу цагийг засах
      if(r.time){
        const t=String(r.time).trim();
        // "Sat Dec 30 1899..." хэлбэр
        if(t.includes("1899")){r.time=safeTime(t);changed=true;}
        // "HH:MM:SS" → "HH:MM"
        else if(/^\d{1,2}:\d{2}:\d{2}$/.test(t)){r.time=t.substring(0,5);changed=true;}
        // 00:xx-07:xx буруу UTC цаг → +8 нэмж UB болгох
        else if(/^\d{2}:\d{2}$/.test(t)){
          const h=parseInt(t.split(":")[0]);
          const m=t.split(":")[1];
          if(h>=0&&h<=7){
            const ubH=(h+8)%24;
            r.time=String(ubH).padStart(2,"0")+":"+m;
            changed=true;
          }
        }
      }
    });
    if(changed)saveRecs(recs);
  }catch(e){}
}

// Хуучин буруу цагийг нэг удаа засах (LocalStorage migration)
function fixLocalStorageTimes(){
  const KEY="habea_time_fixed_v4"; // v4 — 07 цагийн засвар
  if(localStorage.getItem(KEY))return;
  try{
    const recs=getRecs();
    let fixed=0;
    recs.forEach(r=>{
      if(!r.time)return;
      const t=String(r.time).trim();
      if(/^\d{1,2}:\d{2}$/.test(t)){
        const h=parseInt(t.split(":")[0]);
        const m=t.split(":")[1];
        // 00:00-07:59 → UTC цаг → +8 нэмж UB болгох
        if(h>=0&&h<=7){
          const ubH=(h+8)%24;
          r.time=String(ubH).padStart(2,"0")+":"+m;
          fixed++;
        }
        // 19:00-23:59 → UTC цаг → +8 нэмэх
        else if(h>=19&&h<=23){
          const ubH=(h+8)%24;
          r.time=String(ubH).padStart(2,"0")+":"+m;
          fixed++;
        }
      }
    });
    if(fixed>0){
      saveRecs(recs);
      toast(fixed+" бүртгэлийн цаг автоматаар засагдлаа ✓","info");
    }
    localStorage.setItem(KEY,"1");
  }catch(e){}
}

function buildDetailReport(body, selDate, dateRecs) {
  const DEPT_COLORS={Гүйцэтгэл:"#1a6a3a",Оёдол:"#2ecc71",Эсгүүр:"#27ae60",Санхүү:"#16a085",Захиргаа:"#2980b9",Гоёл:"#8e44ad"};
  const SIGS_KEY="habea_rpt_sigs_"+selDate.replace(/\./g,"");
  const MGR_KEY="habea_mgr_sig_v1";
  let sigs={};
  let mgrSig=null,mgrName="";
  try{sigs=JSON.parse(localStorage.getItem(SIGS_KEY)||"{}");}catch(e){}
  try{const ms=JSON.parse(localStorage.getItem(MGR_KEY)||"null");if(ms){mgrSig=ms.sig;mgrName=ms.name||"";}}catch(e){}
  function saveSigs(){try{localStorage.setItem(SIGS_KEY,JSON.stringify(sigs));}catch(e){}}

  // Ажилтны бүртгэлийн гарын үсгийг rec.signature-аас авч sigs-д дүүргэх
  // (тайлан таб нээгдэх бүрт LocalStorage-ийн бүртгэлээс авна)
  dateRecs.forEach(r=>{
    if(!sigs[r.name]&&r.signature&&r.signature!=="signed"){
      sigs[r.name]=r.signature;
    }else if(!sigs[r.name]&&r.signature==="signed"){
      sigs[r.name]="signed"; // гарын үсэг зурсан ч зураг хадгалагдаагүй
    }
  });

  const total=dateRecs.length;
  const passed=dateRecs.filter(r=>r.passed).length;
  const pct=total?Math.round(passed/total*100):0;
  const signed=Object.keys(sigs).length;

  // ── Гарчиг ──
  const hdr=el("div",{className:"rpt-header fadeUp"});
  const hdrInner=h("div",{style:{position:"relative",zIndex:1}});
  hdrInner.appendChild(h("div",{style:{display:"flex",alignItems:"baseline",gap:"2px",marginBottom:"4px"}},[
    h("span",{style:{fontFamily:"'DM Serif Display',serif",fontSize:"24px",color:"var(--gl)"}},["BEST"]),
    h("span",{style:{fontFamily:"'DM Serif Display',serif",fontSize:"24px",color:"#fff"}},["SHOES"])
  ]));
  hdrInner.appendChild(h("div",{style:{color:"rgba(255,255,255,.5)",fontSize:"10px",letterSpacing:".18em",textTransform:"uppercase",marginBottom:"12px"}},["ХАБЭА · Өдрийн тайлан"]));
  const chips=h("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap"}});
  [["📅",selDate],["👥","Нийт: "+total],["✅","Тэнцсэн: "+passed],["📊",pct+"%"]].forEach(([ico,txt])=>{
    chips.appendChild(h("div",{className:"rpt-chip"},[ico+" ",h("span",{},[txt])]));
  });
  hdrInner.appendChild(chips);hdr.appendChild(hdrInner);body.appendChild(hdr);

  if(!total){
    body.appendChild(h("div",{className:"card fadeUp",style:{textAlign:"center",color:"var(--mut)",padding:"24px"}},["Тус өдрийн бүртгэл байхгүй"]));
    return;
  }

  // ── Статистик ──
  const statGrid=el("div",{className:"rpt-stats fadeUp"});
  [{ico:"👥",val:total,lbl:"Нийт"},{ico:"✅",val:passed,lbl:"Тэнцсэн",c:"var(--g)"},{ico:"⚠️",val:total-passed,lbl:"Дутуу",c:"#d35400"},{ico:"✍️",val:signed,lbl:"Гарын үсэг",c:"var(--g)"},{ico:"📊",val:pct+"%",lbl:"Гүйцэтгэл"}].forEach(s=>{
    const b=el("div",{className:"rpt-stat"});
    b.appendChild(h("div",{className:"rpt-stat-ico"},[s.ico]));
    b.appendChild(h("div",{className:"rpt-stat-val",style:{color:s.c||"var(--g)"}},[String(s.val)]));
    b.appendChild(h("div",{className:"rpt-stat-lbl"},[s.lbl]));
    statGrid.appendChild(b);
  });
  body.appendChild(statGrid);

  // ── Тасгийн bars ──
  const deptCard=el("div",{className:"card fadeUp no-print"});
  deptCard.appendChild(h("div",{className:"card-head"},["🏭 Тасгийн байдал"]));
  const depts={};
  dateRecs.forEach(r=>{const d=r.department||"Бусад";if(!depts[d])depts[d]={t:0,p:0};depts[d].t++;if(r.passed)depts[d].p++;});
  Object.entries(depts).forEach(([dept,s])=>{
    const pct2=Math.round(s.p/s.t*100);
    const c=DEPT_COLORS[dept]||"#1a6a3a";
    const row=el("div",{className:"dept-bar-row2"});
    const head=h("div",{className:"dept-bar-head2"},[
      h("span",{style:{fontSize:"12px",fontWeight:"700"}},[dept]),
      h("span",{style:{fontSize:"11px",color:"var(--mut)"}},[s.p+"/"+s.t+" ("+pct2+"%)"])
    ]);
    const track=el("div",{className:"dept-bar-track2"});
    const fill=el("div",{className:"dept-bar-fill2",style:{width:pct2+"%",background:pct2>=80?"linear-gradient(90deg,"+c+",#2ecc71)":"linear-gradient(90deg,#e67e22,#f39c12)"}});
    track.appendChild(fill);row.appendChild(head);row.appendChild(track);deptCard.appendChild(row);
  });
  body.appendChild(deptCard);

  // ── Үйлдлийн товчнууд ──
  const actBar=el("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"12px"}});
  const printBtn=el("button",{className:"btn btn-p btn-sm no-print"},["🖨️ Хэвлэх"]);
  printBtn.onclick=()=>window.print();
  const csvBtn=el("button",{className:"btn btn-o btn-sm no-print"},["📥 CSV"]);
  csvBtn.onclick=()=>{
    const rows=[["Огноо","Цаг","Нэр","Тасаг","Тушаал","Утас","Шалгалт","Гарын үсэг"]];
    dateRecs.forEach(r=>rows.push([r.date,safeTime(r.time),r.name,r.department,r.position||"",r.phone||"",r.passed?"Тэнцсэн":"Дутуу",sigs[r.name]&&sigs[r.name]!=="signed"?"Зурсан (зургийг HTML файлаас харна уу)":"Зурсан"]));
    const csv="\uFEFF"+rows.map(r=>r.map(c=>'"'+String(c||"").replace(/"/g,'""')+'"').join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="ХАБЭА_"+selDate+".csv";a.click();URL.revokeObjectURL(url);
  };

  // HTML export — гарын үсэгтэй хамт Excel-д нээгдэнэ
  const htmlBtn=el("button",{className:"btn btn-o btn-sm no-print"},["🖨️ Тайлан (г/үтэй)"]);
  htmlBtn.onclick=()=>{
    // Хүснэгтийн HTML үүсгэх
    const depts={};
    dateRecs.forEach(r=>{const d=r.department||"Бусад";if(!depts[d])depts[d]=[];depts[d].push(r);});

    let tbody="";
    dateRecs.forEach((r,idx)=>{
      const wSig=sigs[r.name];
      const sigCell=wSig&&wSig!=="signed"
        ?`<img src="${wSig}" style="height:40px;max-width:100px;background:#fff;border:1px solid #ccc;border-radius:4px;">`
        :wSig==="signed"?'<span style="color:#1a6a3a;font-weight:700">✓ Зурсан</span>'
        :'<span style="color:#aaa">—</span>';
      const mgrCell=_mgrSig
        ?`<img src="${_mgrSig}" style="height:40px;max-width:100px;background:#fff;border:1px solid #ccc;border-radius:4px;">`
        :'<span style="color:#aaa">—</span>';
      tbody+=`<tr style="background:${idx%2===0?"#f9f9f9":"#fff"}">
        <td style="padding:6px 10px;border:1px solid #ddd;text-align:center;">${idx+1}</td>
        <td style="padding:6px 10px;border:1px solid #ddd;font-weight:bold;">${r.name||""}</td>
        <td style="padding:6px 10px;border:1px solid #ddd;">${r.department||""}</td>
        <td style="padding:6px 10px;border:1px solid #ddd;font-family:monospace;">${safeTime(r.time)||""}</td>
        <td style="padding:6px 10px;border:1px solid #ddd;text-align:center;">
          <span style="color:${r.passed?"#1a6a3a":"#e74c3c"};font-weight:bold;">${r.passed?"✓ Тэнцсэн":"⚠ Дутуу"}</span>
        </td>
        <td style="padding:6px 10px;border:1px solid #ddd;text-align:center;">${sigCell}</td>
        <td style="padding:6px 10px;border:1px solid #ddd;text-align:center;">${mgrCell}</td>
      </tr>`;
    });

    const total=dateRecs.length;
    const passed=dateRecs.filter(r=>r.passed).length;
    const signed=Object.keys(sigs).length;

    const html=`<!DOCTYPE html>
<html lang="mn"><head><meta charset="UTF-8">
<title>BEST SHOES ХАБЭА - ${selDate}</title>
<style>
  body{font-family:Arial,sans-serif;margin:20px;color:#1a2e1f;}
  h1{color:#1a6a3a;font-size:20px;margin-bottom:4px;}
  .stats{display:flex;gap:16px;margin:12px 0 16px;flex-wrap:wrap;}
  .stat{background:#f0fdf4;border:1px solid #c8e6d0;border-radius:8px;padding:8px 16px;text-align:center;}
  .stat-val{font-size:22px;font-weight:bold;color:#1a6a3a;}
  .stat-lbl{font-size:11px;color:#6b8f71;}
  table{border-collapse:collapse;width:100%;font-size:13px;}
  th{background:#0d3a1f;color:#fff;padding:8px 10px;border:1px solid #0d3a1f;text-align:center;font-size:11px;letter-spacing:.05em;}
  img{display:block;margin:0 auto;}
  @media print{body{margin:10px;}}
</style>
</head><body>
<h1>🏭 BEST SHOES — ХАБЭА Өдрийн тайлан</h1>
<p style="color:#6b8f71;font-size:13px;">📅 ${selDate}</p>
<div class="stats">
  <div class="stat"><div class="stat-val">${total}</div><div class="stat-lbl">Нийт</div></div>
  <div class="stat"><div class="stat-val">${passed}</div><div class="stat-lbl">Тэнцсэн</div></div>
  <div class="stat"><div class="stat-val">${total-passed}</div><div class="stat-lbl">Дутуу</div></div>
  <div class="stat"><div class="stat-val">${signed}</div><div class="stat-lbl">Гарын үсэг</div></div>
  <div class="stat"><div class="stat-val">${total?Math.round(passed/total*100):0}%</div><div class="stat-lbl">Гүйцэтгэл</div></div>
</div>
<table>
  <thead><tr>
    <th>#</th><th>Нэр</th><th>Тасаг</th><th>Цаг</th><th>Шалгалт</th>
    <th>Ажилтны гарын үсэг</th><th>Менежерийн гарын үсэг</th>
  </tr></thead>
  <tbody>${tbody}</tbody>
</table>
<p style="color:#aaa;font-size:11px;margin-top:16px;text-align:right;">BEST SHOES LLC · ХАБЭА · ${selDate}</p>
</body></html>`;

    const blob=new Blob([html],{type:"text/html;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="ХАБЭА_тайлан_"+selDate+".html";
    a.click();
    URL.revokeObjectURL(url);
  };
  const mgrBtn=el("button",{className:"btn btn-o btn-sm no-print"},["✍️ Менежерийн г/ү"]);
  mgrBtn.onclick=()=>showMgrSigModal2(MGR_KEY,(sig,name)=>{mgrSig=sig;mgrName=name;document.querySelectorAll(".mgr-sig-cell").forEach((c,i)=>renderMgrCell(c,sig,name));});
  actBar.appendChild(printBtn);actBar.appendChild(csvBtn);actBar.appendChild(mgrBtn);
  body.appendChild(actBar);

  // ── Хүснэгт ──
  const tblCard=el("div",{className:"card fadeUp",style:{padding:"0",overflow:"hidden"}});

  // Filter buttons
  const filterRow=el("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap",padding:"12px 12px 8px"}});
  let curFilt="all";
  const allDepts=["all",...Object.keys(depts)];
  const filterBtns={};
  allDepts.forEach(d=>{
    const fb=el("button",{className:"rpt-filter-btn"+(d==="all"?" on":"")},[ d==="all"?"Бүгд ("+total+")":d+" ("+depts[d].t+")" ]);
    fb.onclick=()=>{
      curFilt=d;
      Object.values(filterBtns).forEach(b=>b.classList.remove("on"));
      fb.classList.add("on");
      renderRows();
    };
    filterBtns[d]=fb;filterRow.appendChild(fb);
  });
  tblCard.appendChild(filterRow);

  // Legend
  const legend=h("div",{style:{display:"flex",gap:"12px",padding:"0 12px 8px",fontSize:"10px",color:"var(--mut)",flexWrap:"wrap",alignItems:"center"}},[
    h("span",{},[h("span",{style:{width:"8px",height:"8px",borderRadius:"50%",background:"var(--gl)",display:"inline-block",marginRight:"3px"}},[]),"Тэнцсэн"]),
    h("span",{},[h("span",{style:{width:"8px",height:"8px",borderRadius:"50%",background:"#f39c12",display:"inline-block",marginRight:"3px"}},[]),"Дутуу"]),
    h("span",{style:{color:"var(--g)",fontWeight:"700"}},["💡 Нүд дарж гарын үсэг зурна уу"])
  ]);
  tblCard.appendChild(legend);

  // Менежерийн хадгалагдсан гарын үсэг авах
  const MGR_SIG_KEY="habea_mgr_sig_v1";
  const _mgrData=lsGet(MGR_SIG_KEY)||null;
  const _mgrSig=_mgrData?_mgrData.sig:null;
  const _mgrName=_mgrData?(_mgrData.name||"Менежер"):"";

  // Table head — менежерийн г/ү багана нэмэгдсэн
  tblCard.appendChild(h("div",{className:"rpt-tbl-head",style:{gridTemplateColumns:"24px 1fr 90px 70px 60px 100px 100px"}},[
    h("div",{},[" # "]),
    h("div",{},[" Ажилтан "]),
    h("div",{},[" Тасаг "]),
    h("div",{className:"col-rpt-time"},[" Цаг "]),
    h("div",{},[" Шалгалт "]),
    h("div",{style:{color:"rgba(255,255,255,.7)",textAlign:"center",fontSize:"10px",fontWeight:"700",letterSpacing:".06em",textTransform:"uppercase"}},[" Ажилтны г/ү "]),
    h("div",{style:{color:"rgba(255,255,255,.7)",textAlign:"center",fontSize:"10px",fontWeight:"700",letterSpacing:".06em",textTransform:"uppercase"}},[" Менежерийн г/ү "])
  ]));

  const tbody=el("div",{id:"rpt-tbody"});
  tblCard.appendChild(tbody);
  body.appendChild(tblCard);

  function renderRows(){
    tbody.innerHTML="";
    const filtered=curFilt==="all"?dateRecs:dateRecs.filter(r=>r.department===curFilt);
    filtered.forEach((r,idx)=>{
      const hasSig=!!sigs[r.name];
      const row=el("div",{className:"rpt-tbl-row"+(r.passed?"":" fail-r"),style:{gridTemplateColumns:"24px 1fr 90px 70px 60px 100px 100px"}});
      // #
      row.appendChild(h("div",{style:{fontSize:"10px",color:"var(--mut)",fontWeight:"700",textAlign:"center"}},[String(idx+1)]));
      // Ажилтан
      const avC=r.passed?"linear-gradient(135deg,var(--g),var(--gd))":"linear-gradient(135deg,#e67e22,#d35400)";
      const nameCol=h("div",{style:{display:"flex",alignItems:"center",gap:"6px"}},[
        h("div",{style:{width:"26px",height:"26px",borderRadius:"50%",flexShrink:"0",background:avC,color:"#fff",fontSize:"9px",fontWeight:"700",display:"flex",alignItems:"center",justifyContent:"center"}},[initials(r.name)]),
        h("div",{},[
          h("div",{style:{fontWeight:"700",fontSize:"12px"}},[r.name]),
          h("div",{style:{fontSize:"10px",color:"var(--mut)"}},[r.phone?"📞"+r.phone:""])
        ])
      ]);
      row.appendChild(nameCol);
      // Тасаг
      row.appendChild(h("div",{style:{fontSize:"11px",color:"var(--ink)"}},[r.department]));
      // Цаг
      row.appendChild(h("div",{className:"col-rpt-time",style:{fontFamily:"monospace",fontSize:"12px",color:"var(--mut)"}},[safeTime(r.time)]));
      // Шалгалт
      row.appendChild(h("div",{},[el("div",{className:"badge "+(r.passed?"bg-g":"bg-o")},[r.passed?"✓ Тэнцсэн":"⚠ Дутуу"])]));
      // Гарын үсэг
      const sigBox=el("div",{className:"rpt-sig-box col-rpt-sig"+(hasSig?" has-sig":"")});
      const canvas=el("canvas",{id:"rptc-"+idx,style:{width:"90px",height:"36px",background:"#ffffff"}});
      canvas.width=180;canvas.height=72;
      const hint=h("div",{className:"rpt-sig-hint"},["✍️ Зурах"]);
      const clrBtn=el("button",{className:"rpt-sig-clr"},["✕"]);
      clrBtn.onclick=(e)=>{
        e.stopPropagation();
        delete sigs[r.name];saveSigs();
        canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
        sigBox.classList.remove("has-sig");hint.style.opacity="1";
        startRptSig(sigBox,canvas,hint,r.name,idx);
        updateSignedCnt();
      };
      sigBox.appendChild(canvas);sigBox.appendChild(hint);sigBox.appendChild(clrBtn);
      // Гарын үсэг зурагтай бол img-ээр шууд харуулах
      if(hasSig&&sigs[r.name]&&sigs[r.name]!=="signed"){
        const ctx2=canvas.getContext("2d");
        ctx2.fillStyle="#ffffff";ctx2.fillRect(0,0,canvas.width,canvas.height);
        const sigImg=new Image();
        sigImg.onload=()=>{
          ctx2.drawImage(sigImg,0,0,canvas.width,canvas.height);
        };
        sigImg.src=sigs[r.name];
        sigBox.classList.add("has-sig");
      }else if(hasSig&&sigs[r.name]==="signed"){
        // "signed" = бүртгэлтэй ч зураг хадгалагдаагүй
        const ctx2=canvas.getContext("2d");
        ctx2.fillStyle="#ffffff";ctx2.fillRect(0,0,canvas.width,canvas.height);
        ctx2.fillStyle="#ffffff";ctx2.fillRect(0,0,canvas.width,canvas.height);
        ctx2.fillStyle="#1a6a3a";ctx2.font="bold 9px sans-serif";ctx2.textAlign="center";
        ctx2.fillText("✓ Зурсан",canvas.width/2,canvas.height/2+3);
      }
      sigBox.onclick=()=>{if(!sigs[r.name])startRptSig(sigBox,canvas,hint,r.name,idx);};
      row.appendChild(sigBox);

      // Менежерийн гарын үсэг — автоматаар харагдана
      const mgrCell=el("div",{className:"col-rpt-sig",style:{display:"flex",alignItems:"center",justifyContent:"center"}});
      if(_mgrSig){
        // Хадгалагдсан гарын үсгийг img-ээр харуулна
        const mgrBox=el("div",{style:{
          width:"90px",height:"36px",borderRadius:"8px",
          border:"1.5px solid var(--bdr)",overflow:"hidden",
          background:"#ffffff",display:"flex",
          alignItems:"center",justifyContent:"center"
        }});
        const mgrImg=el("img",{
          src:_mgrSig,
          style:{maxWidth:"88px",maxHeight:"34px",objectFit:"contain"},
          title:_mgrName
        });
        mgrBox.appendChild(mgrImg);
        mgrCell.appendChild(mgrBox);
      }else{
        const noBox=el("div",{style:{
          width:"90px",height:"36px",borderRadius:"8px",
          border:"1.5px dashed #555",
          background:"#ffffff",display:"flex",
          alignItems:"center",justifyContent:"center",
          fontSize:"9px",color:"var(--mut)",textAlign:"center",
          padding:"2px"
        }});
        noBox.textContent="⚙️ Тохиргоо";
        mgrCell.appendChild(noBox);
      }
      row.appendChild(mgrCell);
      tbody.appendChild(row);
    });
    updateSignedCnt();
  }

  function updateSignedCnt(){
    const cnt=Object.keys(sigs).length;
    const sv=document.querySelector(".rpt-stat-val");
    // Update signed count in stats (4th item)
    const allVals=document.querySelectorAll(".rpt-stat-val");
    if(allVals[3])allVals[3].textContent=String(cnt);
  }

  function startRptSig(box,canvas,hint,name,idx){
    const ctx=canvas.getContext("2d");
    ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle="#1a2e1f";ctx.lineWidth=3;ctx.lineCap="round";ctx.lineJoin="round";
    let drawing=false,drawn=false;
    function pos(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*(canvas.width/r.width),(t.clientY-r.top)*(canvas.height/r.height)];}
    function start(e){e.preventDefault();drawing=true;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);}
    function move(e){e.preventDefault();if(!drawing)return;drawn=true;hint.style.opacity="0";const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();}
    function end(){
      drawing=false;
      if(drawn){
        ctx.save();ctx.globalAlpha=0.15;ctx.fillStyle="#1a6a3a";ctx.font="bold 8px sans-serif";
        ctx.fillText(name.slice(0,14)+" "+selDate,2,canvas.height-4);ctx.restore();
        const _rc=document.createElement("canvas");_rc.width=canvas.width;_rc.height=canvas.height;const _rx=_rc.getContext("2d");_rx.fillStyle="#ffffff";_rx.fillRect(0,0,_rc.width,_rc.height);_rx.drawImage(canvas,0,0);sigs[name]=_rc.toDataURL("image/jpeg",0.8);saveSigs();
        box.classList.add("has-sig");updateSignedCnt();
        canvas.removeEventListener("mousedown",start);canvas.removeEventListener("mousemove",move);
        canvas.removeEventListener("touchstart",start);canvas.removeEventListener("touchmove",move);
      }
    }
    canvas.addEventListener("mousedown",start);
    canvas.addEventListener("mousemove",move);
    canvas.addEventListener("mouseup",end);
    canvas.addEventListener("mouseleave",end);
    canvas.addEventListener("touchstart",start,{passive:false});
    canvas.addEventListener("touchmove",move,{passive:false});
    canvas.addEventListener("touchend",end);
  }

  renderRows();

  // Footer
  body.appendChild(h("div",{style:{textAlign:"center",fontSize:"11px",color:"var(--mut)",marginTop:"8px",paddingBottom:"8px"}},["BEST SHOES LLC · ХАБЭА · "+selDate]));
}

// Менежерийн гарын үсэг modal (тайлан таб-д)
function showMgrSigModal2(key, onSave){
  const ov=el("div",{className:"modal-overlay"});
  const mc=el("div",{className:"modal-card"});
  mc.appendChild(h("div",{className:"modal-title"},["✍️ Менежерийн гарын үсэг"]));

// 🚨 АЮУЛЫН МЭДЭГДЭЛ — Polling
// ════════════════════════════════════════════════════════════
let _hazardPollInterval = null;
let _lastHazardCheck = Date.now() - 60000; // 1 минут өмнөөс эхлэнэ

function startHazardPolling(){
  if(_hazardPollInterval) return; // Аль хэдийн ажиллаж байна
  // Эхний шалгалт 5 секундын дараа
  setTimeout(pollHazards, 5000);
  // 30 секунд тутам давтана
  _hazardPollInterval = setInterval(pollHazards, 30000);
}

async function pollHazards(){
  try{
    const res = await getFromSheets({action:"getHazards", lastCheck:_lastHazardCheck});
    if(!res||!res.ok||!Array.isArray(res.hazards))return;
    if(!res.hazards.length){ _lastHazardCheck=Date.now(); return; }

    // Шинэ аюулын мэдэгдэл ирлээ
    res.hazards.forEach(hz=>{
      // LocalStorage-д хадгалах
      const notifs=getHazardNotifs();
      const exists=notifs.find(n=>n.id===hz.id);
      if(!exists){
        notifs.unshift({
          id: hz.id,
          name: hz.name||"Аюул мэдэгдсэн",
          dept: hz.location||"",
          hazard: hz.hazard||"",
          time: hz.timestamp||toNow(),
          date: toDay(),
          read: false
        });
        if(notifs.length>20) notifs.splice(20);
        saveHazardNotifs(notifs);

        // Браузерт мэдэгдэл
        if(Notification.permission==="granted"){
          try{
            new Notification("🚨 ХАБЭА — Аюулын мэдэгдэл",{
              body: (hz.name||"Ажилтан")+" аюул мэдэгдлээ"+(hz.location?" ("+hz.location+")":""),
              icon:"icon-192x192.png"
            });
          }catch(e){}
        }
      }
    });
    _lastHazardCheck = Date.now();
  }catch(e){}
}

function getHazardNotifs(){ return lsGet(HAZARD_NOTIF_KEY)||[]; }
function saveHazardNotifs(v){ lsSet(HAZARD_NOTIF_KEY,v); }

function addHazardNotif(name,dept){
  const notifs=getHazardNotifs();
  notifs.unshift({
    id: Date.now(),
    name: name||"Тодорхойгүй",
    dept: dept||"",
    time: toNow(),
    date: toDay(),
    read: false
  });
  // Хамгийн ихдээ 20 мэдэгдэл хадгална
  if(notifs.length>20) notifs.splice(20);
  saveHazardNotifs(notifs);
}

function getUnreadHazardCount(){
  return getHazardNotifs().filter(n=>!n.read).length;
}

function markHazardNotifsRead(){
  const notifs=getHazardNotifs();
  notifs.forEach(n=>n.read=true);
  saveHazardNotifs(notifs);
}

function renderPin(onOk,onBack){
  const app=document.getElementById("app");app.innerHTML="";
  let code="";
  const dots=Array.from({length:4},()=>el("div",{className:"pin-dot"}));
  function upd(){
    dots.forEach((d,i)=>{d.className="pin-dot"+(i<code.length?" on":"");});
    if(code.length===4){
      setTimeout(async()=>{
        const _lockKey="habea_pin_lock";
        const _lockData=JSON.parse(localStorage.getItem(_lockKey)||'{"attempts":0,"until":0}');
        if(Date.now()<_lockData.until){
          const _rem=Math.ceil((_lockData.until-Date.now())/1000);
          toast(`${_rem}с хүлээнэ үү!`,"err");code="";upd();return;
        }
        const hh=await hashPin(code);
        if(hh===getPin()){
          localStorage.setItem(_lockKey,JSON.stringify({attempts:0,until:0}));
          onOk();
        }else{
          _lockData.attempts=(_lockData.attempts||0)+1;
          if(_lockData.attempts>=5){
            _lockData.until=Date.now()+60000;
            _lockData.attempts=0;
            toast("5 удаа буруу оруулсан — 1 минут хаагдлаа","err");
          }else{
            toast(`Буруу PIN! (${_lockData.attempts}/5)`,"err");
          }
          localStorage.setItem(_lockKey,JSON.stringify(_lockData));
          code="";upd();
        }
      },120);
    }
  }
  function press(v){if(v==="del")code=code.slice(0,-1);else if(code.length<4)code+=v;upd();}
  const pad=el("div",{className:"pin-pad"});
  [1,2,3,4,5,6,7,8,9].forEach(n=>{const b=el("button",{className:"pin-btn"},[String(n)]);b.onclick=()=>press(String(n));pad.appendChild(b);});

  pad.appendChild(be);pad.appendChild(b0);pad.appendChild(bd);
  const card=el("div",{className:"glass pin-card scaleIn"});
  card.appendChild(brand(22,false));
  card.appendChild(h("div",{style:{color:"var(--mut)",fontSize:"13px",marginTop:"8px",marginBottom:"4px"}},["Менежерийн PIN код"]));
  card.appendChild(el("div",{className:"pin-dots"},dots));
  card.appendChild(pad);
  const bb=el("button",{className:"btn btn-o",style:{marginTop:"16px"}},["← Буцах"]);bb.onclick=onBack;card.appendChild(bb);
  const pg=h("div",{className:"center-page",style:{background:"linear-gradient(160deg,var(--gd),var(--g) 70%)"}});

    page.appendChild(wrap);return page;
  }

  // ── Step 0: Мэдээлэл ──
  function buildInfo(){
    // LocalStorage-аас ажилтны жагсаалт авах (Sheets-тэй синк хийгдсэн байна)
    const workers=getWrks();
    const div=el("div",{className:"fadeUp"});
    div.appendChild(h("div",{style:{fontFamily:"'DM Serif Display',serif",fontSize:"20px",color:"var(--g)",margin:"8px 0 4px"}},["Мэдээлэл оруулах"]));
    div.appendChild(h("div",{style:{fontSize:"12px",color:"var(--mut)",marginBottom:"14px"}},["Тасгаа сонгоод нэрээ оруулна уу"]));

    div.appendChild(h("div",{className:"inp-label"},["Тасаг / Хэлтэс *"]));
    const deptGrid=el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"6px",marginBottom:"14px"}});
    div.appendChild(deptGrid);

    const modeWrap=el("div",{style:{display:"flex",gap:"6px",marginBottom:"10px"}});
    const modeList=el("button",{style:{flex:"1",padding:"9px 6px",borderRadius:"10px",fontSize:"12px",fontWeight:"700",fontFamily:"'DM Sans',sans-serif",cursor:"pointer",transition:"all .15s",border:"1.5px solid",borderColor:state.nameMode==="list"?"var(--g)":"var(--bdr)",background:state.nameMode==="list"?"var(--g)":"var(--wh)",color:state.nameMode==="list"?"#fff":"var(--mut)"}},["📋 Жагсаалтаас сонгох"]);
    const modeManual=el("button",{style:{flex:"1",padding:"9px 6px",borderRadius:"10px",fontSize:"12px",fontWeight:"700",fontFamily:"'DM Sans',sans-serif",cursor:"pointer",transition:"all .15s",border:"1.5px solid",borderColor:state.nameMode==="manual"?"var(--g)":"var(--bdr)",background:state.nameMode==="manual"?"var(--g)":"var(--wh)",color:state.nameMode==="manual"?"#fff":"var(--mut)"}},["✏️ Өөрөө бичих"]);
    modeWrap.appendChild(modeList);modeWrap.appendChild(modeManual);
    div.appendChild(h("div",{className:"inp-label"},["Нэр оруулах горим"]));
    div.appendChild(modeWrap);

    const nameWrap=el("div",{className:"inp-wrap"});
    div.appendChild(nameWrap);

    nameWrap.appendChild(h("div",{className:"inp-label"},["Ажилтны нэр *"]));
    const nameInpList=el("input",{className:"inp",type:"text",
      placeholder:state.department?"Нэр дарж сонгоно уу ▾":"Эхлээд тасгаа сонгоно уу",
      value:state.nameMode==="list"?state.name:"",
      style:{cursor:"pointer",caretColor:"transparent",display:state.nameMode==="list"?"block":"none",background:state.department?"var(--wh)":"#f7faf8",color:state.department?"var(--ink)":"var(--mut)"}
    });
    nameWrap.appendChild(nameInpList);

    function normalizeName(raw){return raw.trim().replace(/\s+/g," ").split(" ").map(w=>w.length?w[0].toUpperCase()+w.slice(1):"").join(" ");}
    const CYRILLIC_RE=/^[\u0400-\u04FF\s\-]+$/;
    const LATIN_RE=/[a-zA-Z]/;

    const nameInpManual=el("input",{className:"inp",type:"text",placeholder:"Монгол үсгээр бичнэ үү",value:state.nameMode==="manual"?state.name:"",style:{display:state.nameMode==="manual"?"block":"none"}});
    const nameErrMsg=el("div",{style:{fontSize:"11px",color:"#c0392b",fontWeight:"600",marginTop:"4px",display:"none",paddingLeft:"2px"}},["⚠️ Зөвхөн монгол (кирилл) үсгээр бичнэ үү"]);

    // ── Жагсаалтад байгаа нэр давхцах үед сануулга ──
    const nameDupWarn=el("div",{style:{
      display:"none",marginTop:"6px",padding:"10px 12px",
      background:"#fffbeb",border:"1.5px solid #f59e0b",borderRadius:"10px",
      fontSize:"12px",lineHeight:"1.55"
    }});
    nameWrap.appendChild(nameInpManual);
    nameWrap.appendChild(nameErrMsg);
    nameWrap.appendChild(nameDupWarn);

    // Жагсаалтад байгаа нэр бичвэл сануулга + горим солих товч
    function checkDuplicateInManual(raw){
      if(!raw||raw.trim().length<2){nameDupWarn.style.display="none";return;}
      const nm=raw.trim().toLowerCase();
      const found=workers.find(w=>normName(w.name)===nm||normName(w.name).startsWith(nm));
      if(found){
        nameDupWarn.style.display="block";
        nameDupWarn.innerHTML="";
        nameDupWarn.appendChild(h("div",{style:{fontWeight:"700",color:"#d35400",marginBottom:"4px"}},["⚠️ Энэ нэртэй ажилтан жагсаалтад байна"]));
        nameDupWarn.appendChild(h("div",{style:{color:"#92400e",marginBottom:"8px"}},["\""+found.name+"\" — "+found.department+"\n\nЖагсаалтаас сонгох горим руу шилжиж нэрээ сонгоно уу."]));
        const goList=el("button",{style:{
          padding:"7px 14px",background:"var(--g)",color:"#fff",border:"none",
          borderRadius:"8px",fontSize:"12px",fontWeight:"700",cursor:"pointer",fontFamily:"inherit"
        }},["📋 Жагсаалтаас сонгох →"]);
        goList.onclick=()=>{
          state.department=state.department; // хэвээр үлдэнэ
          switchMode("list");
        };
        nameDupWarn.appendChild(goList);
      }else{
        nameDupWarn.style.display="none";
      }
    }

    nameInpManual.oninput=()=>{
      const raw=nameInpManual.value;
      if(raw&&LATIN_RE.test(raw)){nameErrMsg.style.display="block";nameInpManual.style.borderColor="#e74c3c";nameInpManual.style.boxShadow="0 0 0 3px rgba(231,76,60,.12)";}
      else{nameErrMsg.style.display="none";nameInpManual.style.borderColor="";nameInpManual.style.boxShadow="";}
      state.name=raw;
      // Бодит цагт жагсаалтад байгаа эсэх шалгах
      checkDuplicateInManual(raw);
    };
    nameInpManual.addEventListener("blur",()=>{
      if(nameInpManual.value&&!LATIN_RE.test(nameInpManual.value)){
        const normalized=normalizeName(nameInpManual.value);
        nameInpManual.value=normalized;state.name=normalized;
      }
    });

    let nameDropdown=null;
    function closeDropdown(){if(nameDropdown){nameDropdown.remove();nameDropdown=null;}}
    function openDropdown(){
      closeDropdown();
      if(!state.department)return;
      // LocalStorage + шинэхэн Sheets мэдээлэл нэгтгэж харуулах
      const allWrks=getWrks();
      const filtered=allWrks.filter(w=>w.department===state.department);
      nameDropdown=el("div",{className:"name-dropdown"});
      if(!filtered.length){
        nameDropdown.appendChild(h("div",{className:"name-dropdown-empty"},["Энэ тасагт бүртгэлтэй ажилтан байхгүй\n— Өөрөө бичих горимыг ашиглана уу"]));
        // Sheets-ээс дахин татах оролдлого
        fetchWorkersFromSheets().then(ws=>{
          if(!ws||!ws.length)return;
          const bl=new Set(getBlacklist().map(b=>normName(b.name)));
          const local=getWrks();
          const localMap={};local.forEach(w=>{localMap[normName(w.name)]=w;});
          let changed=false;
          ws.forEach(w=>{
            const key=normName(w.name);
            if(bl.has(key))return;
            if(!localMap[key]){local.push(w);localMap[key]=w;changed=true;}
            else{
              if(w.department&&localMap[key].department!==w.department){localMap[key].department=w.department;changed=true;}
              if(w.position&&localMap[key].position!==w.position){localMap[key].position=w.position;changed=true;}
            }
          });
          if(changed){saveWrks(local);openDropdown();}
        }).catch(()=>{});
      }else{
        filtered.forEach(w=>{
          const it=el("div",{className:"name-dropdown-item"});
          const av=el("div",{style:{width:"28px",height:"28px",borderRadius:"50%",flexShrink:"0",background:"linear-gradient(135deg,var(--g),var(--gd))",color:"#fff",fontSize:"10px",fontWeight:"700",display:"flex",alignItems:"center",justifyContent:"center"}},[initials(w.name)]);
          const info=h("div",{style:{flex:"1",minWidth:"0"}},[h("div",{style:{fontWeight:"700",fontSize:"13px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},[w.name]),h("div",{style:{fontSize:"11px",color:"var(--mut)"}},[w.position||""])]);
          it.appendChild(av);it.appendChild(info);
          it.addEventListener("mousedown",(e)=>{
            e.preventDefault();e.stopPropagation();
            state.name=w.name;state.position=w.position||"";state.phone=w.phone||"";
            nameInpList.value=w.name;posInp.value=w.position||"";phoneInp.value=w.phone||"";
            closeDropdown();
          });
          nameDropdown.appendChild(it);
        });
      }
      nameWrap.appendChild(nameDropdown);
    }

    nameInpList.addEventListener("mousedown",(e)=>{
      e.preventDefault();
      if(!state.department){toast("Эхлээд тасгаа сонгоно уу","info");return;}
      if(nameDropdown)closeDropdown();else openDropdown();
    });
    document.addEventListener("mousedown",function outsideClose(e){
      if(!nameWrap.contains(e.target)){closeDropdown();document.removeEventListener("mousedown",outsideClose);}
    });

    function switchMode(mode){
      state.nameMode=mode;state.name="";state.position="";state.phone="";
      closeDropdown();
      nameErrMsg.style.display="none";nameInpManual.style.borderColor="";nameInpManual.style.boxShadow="";
      nameDupWarn.style.display="none";
      if(mode==="list"){
        nameInpList.style.display="block";nameInpManual.style.display="none";nameInpList.value="";
        modeList.style.background="var(--g)";modeList.style.color="#fff";modeList.style.borderColor="var(--g)";
        modeManual.style.background="var(--wh)";modeManual.style.color="var(--mut)";modeManual.style.borderColor="var(--bdr)";
        if(state.department)openDropdown();
      }else{
        nameInpList.style.display="none";nameInpManual.style.display="block";nameInpManual.value="";
        modeManual.style.background="var(--g)";modeManual.style.color="#fff";modeManual.style.borderColor="var(--g)";
        modeList.style.background="var(--wh)";modeList.style.color="var(--mut)";modeList.style.borderColor="var(--bdr)";
        setTimeout(()=>nameInpManual.focus(),50);
      }
      posInp.value="";phoneInp.value="";
    }
    modeList.onclick=()=>switchMode("list");
    modeManual.onclick=()=>switchMode("manual");

    const pw=el("div",{className:"inp-wrap"});
    pw.appendChild(h("div",{className:"inp-label"},["Албан тушаал *"]));
    const posInp=el("input",{className:"inp",type:"text",placeholder:"Жишээ: Оператор",value:state.position});
    posInp.oninput=()=>{state.position=posInp.value;};
    pw.appendChild(posInp);div.appendChild(pw);

    const phw=el("div",{className:"inp-wrap"});
    phw.appendChild(h("div",{className:"inp-label"},["Утасны дугаар"]));
    const phoneInp=el("input",{className:"inp",type:"tel",placeholder:"99XXXXXX",value:state.phone});
    phoneInp.oninput=()=>{state.phone=phoneInp.value;};
    phw.appendChild(phoneInp);div.appendChild(phw);

    DEPTS.forEach(dept=>{
      const db=el("button",{style:{padding:"10px 6px",border:"1.5px solid",borderRadius:"10px",fontSize:"13px",fontWeight:"600",fontFamily:"'DM Sans',sans-serif",cursor:"pointer",transition:"all .15s",textAlign:"center",borderColor:state.department===dept?"var(--g)":"var(--bdr)",background:state.department===dept?"var(--g)":"var(--wh)",color:state.department===dept?"#fff":"var(--ink)"}},[dept]);
      db.onclick=()=>{
        state.department=dept;state.name="";state.position="";state.phone="";
        nameInpList.value="";nameInpManual.value="";posInp.value="";phoneInp.value="";
        deptGrid.querySelectorAll("button").forEach(b=>{b.style.background="var(--wh)";b.style.color="var(--ink)";b.style.borderColor="var(--bdr)";});
        db.style.background="var(--g)";db.style.color="#fff";db.style.borderColor="var(--g)";
        nameInpList.style.background="var(--wh)";nameInpList.style.color="var(--ink)";
        nameInpList.placeholder="Нэр дарж сонгоно уу ▾";
        // Тасаг сонгохдоо Sheets-ээс шинэхэн мэдээлэл татаж dropdown-г шинэчлэх
        fetchWorkersFromSheets().then(ws=>{
          if(!ws||!ws.length)return;
          const bl=new Set(getBlacklist().map(b=>normName(b.name)));
          const local=getWrks();
          const localMap={};local.forEach(w=>{localMap[normName(w.name)]=w;});
          let changed=false;
          ws.forEach(w=>{
            const key=normName(w.name);
            if(bl.has(key))return;
            if(!localMap[key]){local.push(w);localMap[key]=w;changed=true;}
            else{
              if(w.department&&localMap[key].department!==w.department){localMap[key].department=w.department;changed=true;}
              if(w.position&&localMap[key].position!==w.position){localMap[key].position=w.position;changed=true;}
            }
          });
          if(changed)saveWrks(local);
        }).catch(()=>{});
        if(state.nameMode==="list")openDropdown();
        else{closeDropdown();setTimeout(()=>nameInpManual.focus(),50);}
      };
      deptGrid.appendChild(db);
    });

    const nb=el("button",{className:"btn btn-p",style:{marginTop:"8px"}},["Үргэлжлүүлэх →"]);
    nb.onclick=()=>{
      let nm=state.nameMode==="manual"
        ?normalizeName(nameInpManual.value)
        :state.name.trim();

      // ══ ЦАГИЙН ХЯЗГААР ══
      const _cfg3=getCfg();
      if(_cfg3.regStart&&_cfg3.regEnd){
        const _ubp2=_getUBDate(),_nm2=parseInt(_ubp2.hour)*60+parseInt(_ubp2.minute);
        const [_sh,_sm]=(_cfg3.regStart).split(":").map(Number);
        const [_eh,_em]=(_cfg3.regEnd).split(":").map(Number);
        if(_nm2<_sh*60+_sm||_nm2>_eh*60+_em){
          return toast("Бүртгэлт "+_cfg3.regStart+"-"+_cfg3.regEnd+" цагт л боломжтой","err");
        }
      }

      if(!nm)return toast(state.nameMode==="list"?"Нэрийг сонгоно уу":"Нэрийг бичнэ үү","err");
      if(state.nameMode==="manual"&&LATIN_RE.test(nm)){
        nameInpManual.style.borderColor="#e74c3c";nameInpManual.style.boxShadow="0 0 0 3px rgba(231,76,60,.12)";
        nameErrMsg.style.display="block";
        return toast("Зөвхөн монгол (кирилл) үсгээр бичнэ үү","err");
      }
      if(state.nameMode==="manual"&&nm&&!CYRILLIC_RE.test(nm)){
        return toast("Нэрт зөвхөн монгол үсэг, зай, зураас ашиглана уу","err");
      }
      // Өөрөө бичих горимд жагсаалтад байгаа нэр бол хориглоно
      if(state.nameMode==="manual"){
        const dup=workers.find(w=>normName(w.name)===normName(nm));
        if(dup){
          nameDupWarn.style.display="block";
          return toast("\""+dup.name+"\" жагсаалтад байна — жагсаалтаас сонгоно уу","err");
        }
      }
      if(!state.department)return toast("Тасгийг сонгоно уу","err");
      const pos=posInp.value.trim();
      if(!pos)return toast("Албан тушаалыг оруулна уу","err");

      // ══════════════════════════════════════════
      // 🚫 BLACKLIST ШАЛГАХ — менежер устгасан бол хориглоно
      // ══════════════════════════════════════════
      if(isBlacklisted(nm)){
        const app=document.getElementById("app");app.innerHTML="";
        const page=h("div",{className:"center-page",style:{background:"var(--gp)"}});
        const card=el("div",{className:"glass scaleIn",style:{maxWidth:"340px",width:"100%",padding:"32px",textAlign:"center"}});
        card.appendChild(h("div",{style:{fontSize:"56px",marginBottom:"12px"}},["🚫"]));
        card.appendChild(brand(22,false));
        card.appendChild(h("div",{style:{fontFamily:"'DM Serif Display',serif",fontSize:"16px",color:"#c0392b",margin:"16px 0 6px"}},["Нэвтрэх эрхгүй"]));
        card.appendChild(h("div",{style:{fontSize:"13px",color:"var(--mut)",marginBottom:"8px"}},[nm]));
        card.appendChild(h("div",{style:{fontSize:"12px",color:"var(--mut)",background:"#fef2f2",borderRadius:"12px",padding:"12px",marginBottom:"20px",lineHeight:"1.6"}},["Таны бүртгэл менежерт хасагдсан байна.\nДахин нэвтрэх эрх байхгүй.\n\nЛавлах бол менежертэй холбогдоно уу."]));
        card.appendChild(el("button",{className:"btn btn-o",onclick:renderHome},["← Буцах"]));
        page.appendChild(card);app.appendChild(page);
        return;
      }
      // ══════════════════════════════════════════

      if(state.nameMode==="manual"){nameInpManual.value=nm;}
      state.name=nm;state.position=pos;state.phone=phoneInp.value.trim();

      // autoSaveWorker нь Step 3 (Бүртгүүлэх) дарахад л дуудагдана
      // Step 0-д дуудахгүй — гарын үсэг зурж дуусаагүй байж болно

      if(hasSignedToday(nm)){
        const app=document.getElementById("app");app.innerHTML="";
        const page=h("div",{className:"center-page",style:{background:"var(--gp)"}});
        const card=el("div",{className:"glass scaleIn",style:{maxWidth:"340px",width:"100%",padding:"32px",textAlign:"center"}});
        card.appendChild(h("div",{style:{fontSize:"48px",marginBottom:"12px"}},["✅"]));
        card.appendChild(brand(22,false));
        card.appendChild(h("div",{style:{fontFamily:"'DM Serif Display',serif",fontSize:"16px",color:"var(--g)",margin:"14px 0 6px"}},["Өнөөдөр аль хэдийн бүртгүүлсэн байна"]));
        card.appendChild(h("div",{style:{fontSize:"12px",color:"var(--mut)",marginBottom:"20px"}},[nm+" та өнөөдрийн ХАБЭА бүртгэлд гарын үсэг зурсан байна."]));
        card.appendChild(el("button",{className:"btn btn-p",onclick:renderHome},["Нүүр хуудас"]));
        page.appendChild(card);app.appendChild(page);return;
      }
      step=1;render();
    };
    div.appendChild(nb);return div;
  }

  // ── Step 1: Зааварчилгаа ──
  function buildInstr(){
    const div=el("div",{className:"fadeUp"});
    const card=el("div",{className:"card",style:{marginTop:"8px"}});
    card.appendChild(h("div",{className:"card-head"},["📋 Аюулгүй ажиллагааны санамж"]));
    const activeInstr=getInstructions()||INSTRUCTIONS;
    activeInstr.forEach((txt,i)=>{const r=h("div",{className:"instr-item"});r.appendChild(h("div",{className:"instr-num"},[String(i+1)]));r.appendChild(h("div",{className:"instr-txt"},[txt]));card.appendChild(r);});
    const cw=el("div",{className:"confirm-wrap"});
    const cb=el("div",{className:"confirm-box"+(state.instrRead?" on":"")});
    if(state.instrRead)cb.innerHTML=chk();
    cw.appendChild(cb);cw.appendChild(h("div",{style:{fontSize:"13px",fontWeight:"700"}},["Санамжийг уншиж танилцсан"]));
    cw.onclick=()=>{state.instrRead=!state.instrRead;cb.className="confirm-box"+(state.instrRead?" on":"");cb.innerHTML=state.instrRead?chk():"";};
    card.appendChild(cw);div.appendChild(card);
    const nb=el("button",{className:"btn btn-p",style:{marginTop:"4px"}},["Үргэлжлүүлэх →"]);
    nb.onclick=()=>{if(!state.instrRead)return toast("Санамжийг уншсанаа тэмдэглэнэ үү","err");step=2;render();};
    div.appendChild(nb);return div;
  }

  // ── Step 2: Шалгалт ──
  function buildCheck(){
    const div=el("div",{className:"fadeUp"});
    const card=el("div",{className:"card",style:{marginTop:"8px"}});
    card.appendChild(h("div",{className:"card-head"},["✅ Өдрийн шалгах хуудас"]));
    const _activeCL2=lsGet("habea_checklist_v1")||CHECKLIST;
    const _allItems2=_activeCL2.flatMap(c=>c.items);
    _activeCL2.forEach(g=>{
      card.appendChild(h("div",{className:"check-cat"},[g.cat]));
      g.items.forEach(item=>{
        const r=el("div",{className:"check-item"});
        const b=el("div",{className:"check-box"+(state.checked.has(item)?" on":"")});
        if(state.checked.has(item))b.innerHTML=chk();
        r.appendChild(b);r.appendChild(h("div",{className:"check-txt"},[item]));
        r.onclick=()=>{if(state.checked.has(item)){state.checked.delete(item);b.className="check-box";b.innerHTML="";}else{state.checked.add(item);b.className="check-box on";b.innerHTML=chk();}pg.textContent=`${state.checked.size} / ${_allItems2.length} биелүүлсэн (шаардлага: ≥${PASS_PCT}%)`;};
        card.appendChild(r);
      });
    });
    const pg=el("div",{style:{marginTop:"12px",padding:"10px 12px",background:"var(--gp)",borderRadius:"10px",fontSize:"12px",color:"var(--mut)"}});
    pg.textContent=`${state.checked.size} / ${_allItems2.length} биелүүлсэн (шаардлага: ≥${PASS_PCT}%)`;
    card.appendChild(pg);div.appendChild(card);
    const nb3=el("button",{className:"btn btn-p",style:{marginTop:"4px"}},["Гарын үсэг зурах →"]);
    nb3.onclick=()=>{
      const minRequired=Math.ceil(_allItems2.length*PASS_PCT/100);
      if(state.checked.size<minRequired)return toast(`Шалгалт дутуу! Дор хаяж ${minRequired} зүйл (${PASS_PCT}%) биелүүлнэ үү. Одоо: ${state.checked.size}/${_allItems2.length}`,"err");
      step=3;render();
    };
    div.appendChild(nb3);return div;
  }

  // ── Step 3: Гарын үсэг ──
  function buildSig(){
    const div=el("div",{className:"fadeUp"});
    const card=el("div",{className:"card",style:{marginTop:"8px"}});
    card.appendChild(h("div",{className:"card-head"},["✍️ Гарын үсэг"]));
    const so=el("div",{className:"sig-outer",style:{height:"160px"}});
    const hint=h("div",{className:"sig-hint"},["Энд гарын үсгээ зурна уу"]);
    sigCanvas=el("canvas",{style:{display:"block",width:"100%",height:"160px",background:"#ffffff"}});
    const clr=el("button",{className:"sig-clear"},["Арилгах"]);
    so.appendChild(sigCanvas);so.appendChild(hint);so.appendChild(clr);card.appendChild(so);
    function initCanvas(){
      const w=so.offsetWidth;
      if(!w){requestAnimationFrame(initCanvas);return;}
      sigCanvas.width=w;sigCanvas.height=160;
      sigCtx=sigCanvas.getContext("2d");
    sigCtx.fillStyle="#ffffff";sigCtx.fillRect(0,0,sigCanvas.width,sigCanvas.height);
    sigCtx.strokeStyle="#1a2e1f";sigCtx.lineWidth=2.5;sigCtx.lineCap="round";sigCtx.lineJoin="round";
    }
    requestAnimationFrame(initCanvas);
    function pos(e){const r=sigCanvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*(sigCanvas.width/r.width),(t.clientY-r.top)*(sigCanvas.height/r.height)];}
    sigCanvas.addEventListener("mousedown",e=>{if(!sigCtx)return;drawing=true;const[x,y]=pos(e);sigCtx.beginPath();sigCtx.moveTo(x,y);});
    sigCanvas.addEventListener("mousemove",e=>{if(!drawing||!sigCtx)return;hasDrawn=true;hint.style.opacity="0";const[x,y]=pos(e);sigCtx.lineTo(x,y);sigCtx.stroke();});
    sigCanvas.addEventListener("mouseup",()=>{drawing=false;});
    sigCanvas.addEventListener("mouseleave",()=>{drawing=false;});
    sigCanvas.addEventListener("touchstart",e=>{e.preventDefault();if(!sigCtx)return;drawing=true;const[x,y]=pos(e);sigCtx.beginPath();sigCtx.moveTo(x,y);},{passive:false});
    sigCanvas.addEventListener("touchmove",e=>{e.preventDefault();if(!drawing||!sigCtx)return;hasDrawn=true;hint.style.opacity="0";const[x,y]=pos(e);sigCtx.lineTo(x,y);sigCtx.stroke();},{passive:false});
    sigCanvas.addEventListener("touchend",()=>{drawing=false;});
    clr.onclick=()=>{if(!sigCtx)return;sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);hint.style.opacity="1";hasDrawn=false;};
    const _dynItems=(lsGet("habea_checklist_v1")||CHECKLIST).flatMap(c=>c.items);
    const passed=state.checked.size>=Math.ceil(_dynItems.length*PASS_PCT/100);
    const sm=el("div",{style:{marginTop:"12px",padding:"12px",background:"var(--gp)",borderRadius:"12px",fontSize:"12px"}});
    sm.innerHTML=`<b style="color:var(--g)">${state.name}</b> — ${state.position} | ${state.department}<br>Шалгалт: <b style="color:${passed?"var(--g)":"#e74c3c"}">${state.checked.size}/${ALL_ITEMS.length} ${passed?"✅ Тэнцсэн":"⚠️ Дутуу"}</b><br>${toDay()} ${toNow()}`;
    card.appendChild(sm);div.appendChild(card);
    const sb=el("button",{className:"btn btn-p",style:{marginTop:"4px"}},["Бүртгүүлэх ✓"]);
    sb.onclick=async()=>{
      if(!hasDrawn)return toast("Гарын үсгээ зурна уу","err");
      sb.textContent="Хадгалж байна...";sb.disabled=true;
      if(sigCtx){
        sigCtx.save();sigCtx.globalAlpha=0.22;sigCtx.fillStyle="#1a6a3a";sigCtx.font="bold 11px sans-serif";
        sigCtx.fillText(state.name.trim()+" | "+toDay(),6,sigCanvas.height-6);sigCtx.restore();
      }
      // Цаг: гарын үсэг зурж буй БОДИТ цаг (LocalStorage-ийн хуучин утгаас үл хамаарна)
      const _signTime=toNow();
      const rec={name:state.name.trim(),department:state.department.trim(),position:state.position.trim(),phone:state.phone.trim(),date:toDay(),time:_signTime,passed,instrRead:state.instrRead,checkedCount:state.checked.size,signature:(()=>{const _tc=document.createElement("canvas");_tc.width=sigCanvas.width;_tc.height=sigCanvas.height;const _tx=_tc.getContext("2d");_tx.fillStyle="#ffffff";_tx.fillRect(0,0,_tc.width,_tc.height);_tx.drawImage(sigCanvas,0,0);return _tc.toDataURL("image/jpeg",0.8);})()};
      const recs=getRecs();recs.push(rec);saveRecs(recs);
      // Утасны дугаар шинэчлэгдэх (байгаа ажилтанд), шинэ ажилтан нэмэх
      autoSaveWorker({name:rec.name,department:rec.department,position:rec.position,phone:rec.phone});
      await sendSheets(rec);
      onDone(rec);
    };
    div.appendChild(sb);return div;
  }

  render();
}

  let _lastAct=Date.now();

    if(Date.now()-_lastAct>30*60*1000){
      clearInterval(rt);clearInterval(_stInterval);
      toast("30 минут идэвхгүй байсан тул гарлаа","info");onLogout();
    }

  function ms(lbl,val,ico){return h("div",{className:"stat-box"},[h("div",{className:"stat-ico"},[ico]),h("div",{className:"stat-val",style:{fontSize:"20px"}},[String(val)]),h("div",{className:"stat-lbl"},[lbl])]);}

  async function syncFromSheets(date){
    const remote=await fetchTodayFromSheets(date);if(!remote.length)return;
    const local=getRecs();
    const merged=mergeRecords(local,remote);
    // Sheets өгөгдлийг давуу болгосон тул merged нь local-аас өөр байж болно
    // Тиймээс length шалгалтгүйгээр хадгалах
    saveRecs(merged);
  }
  async function syncWorkersFromSheets(){
    const ws=await fetchWorkersFromSheets();if(!ws||!ws.length)return;
    const local=getWrks();
    const seen=new Set(local.map(w=>normName(w.name)));
    const bl=new Set(getBlacklist().map(b=>normName(b.name)));
    let added=0;
    ws.forEach(w=>{
      if(!seen.has(normName(w.name))&&!bl.has(normName(w.name))){local.push(w);seen.add(normName(w.name));added++;}
    });
    if(added>0)saveWrks(local);
  }
